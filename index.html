/* ---------- tagihan & rencana ---------- */
Actions.editPlanned = (el, ev, preset = {}) => {
  const p = el && el.dataset.id ? byId(S().planned, el.dataset.id) : null;
  const v = p || { kind: preset.kind || 'bill', type: preset.type || 'expense', date: D.today(), rec: { freq: preset.kind === 'bill' ? 'monthly' : 'none' } };
  Modal.open({
    title: p ? 'Ubah tagihan/rencana' : (v.kind === 'bill' ? 'Tambah tagihan' : 'Tambah rencana transaksi'),
    body: `<p class="small muted">Tagihan dan rencana masuk ke proyeksi, tetapi <b>tidak mengubah saldo</b> sampai Anda menandainya dibayar/diterima.</p>
    <div class="typepick">${['expense', 'income', 'transfer'].map((k) => `<label><input type="radio" name="type" value="${k}" ${k === v.type ? 'checked' : ''}>${k === 'expense' ? 'Pengeluaran' : k === 'income' ? 'Pemasukan' : 'Transfer/nabung'}</label>`).join('')}</div>
    <div class="form">
      ${F.text('title', 'Nama', v.title || '', { af: true, ph: 'mis. Bayar kos, Uang bulanan' })}
      ${F.money('amount', 'Nominal', v.amount ?? '')}
      ${F.date('date', 'Jatuh tempo / tanggal', v.date)}
      ${F.select('rfreq', 'Pengulangan', F.opts([['none', 'Sekali'], ['weekly', 'Setiap minggu'], ['monthly', 'Setiap bulan']], v.rec?.freq || 'none'))}
      ${F.date('runtil', 'Berulang sampai (opsional)', v.rec?.until || '')}
      <div class="field" data-catwrap><label for="f_categoryId">Kategori</label><select class="input" id="f_categoryId" name="categoryId">${Cat.options(v.type === 'income' ? 'income' : 'expense', v.categoryId, { empty: true })}</select></div>
      ${F.select('accountId', 'Akun', Fin.accOptions(v.accountId, { empty: true }), { help: 'Kosongkan bila belum tahu; dianggap uang siap pakai.' })}
      <div class="field" data-towrap ${v.type === 'transfer' ? '' : 'hidden'}><label for="f_toAccountId">Ke akun</label><select class="input" id="f_toAccountId" name="toAccountId">${Fin.accOptions(v.toAccountId, { empty: true })}</select></div>
      ${F.select('kind', 'Tampilkan sebagai', F.opts([['bill', 'Tagihan (muncul di kalender & halaman Rumah)'], ['plan', 'Rencana keuangan']], v.kind))}
      ${F.area('note', 'Catatan', v.note || '', { rows: 2 })}
    </div>`,
    extraFooter: p ? `<button type="button" class="btn danger" data-del>Hapus</button>` : '',
    onOpen: (form, close) => {
      const upd = () => {
        const t = form.querySelector('[name=type]:checked').value;
        form.querySelector('[data-catwrap]').hidden = t === 'transfer';
        form.querySelector('[data-towrap]').hidden = t !== 'transfer';
        const sel = form.querySelector('[name=categoryId]'); const cur = sel.value; sel.innerHTML = Cat.options(t === 'income' ? 'income' : 'expense', cur, { empty: true });
      };
      $$('[name=type]', form).forEach((r) => r.addEventListener('change', upd));
      const del = form.querySelector('[data-del]');
      if (del) del.onclick = async () => {
        close();
        if (await ask(`Hapus <b>${esc(p.title)}</b>? Transaksi yang sudah dibayar dari item ini tetap tersimpan.`, { ok: 'Hapus' })) { Store.update((s) => (s.planned = s.planned.filter((x) => x.id !== p.id))); toast('Dihapus'); }
      };
    },
    onSubmit: (d, form) => {
      if (!d.title) return fieldError(form, 'title', 'Nama wajib diisi.');
      const amount = parseAmount(d.amount); if (!(amount > 0)) return fieldError(form, 'amount', 'Isi nominal lebih dari Rp0.');
      if (!D.valid(d.date)) return fieldError(form, 'date', 'Tanggal tidak valid.');
      if (d.type === 'transfer' && (!d.accountId || !d.toAccountId || d.accountId === d.toAccountId)) return fieldError(form, 'toAccountId', 'Transfer butuh akun asal dan tujuan yang berbeda.');
      const rec = { freq: d.rfreq, until: D.valid(d.runtil) ? d.runtil : '' };
      Store.update((s) => {
        const data = { kind: d.kind, type: d.type, title: d.title, amount, date: d.date, rec, categoryId: d.type === 'transfer' ? '' : d.categoryId, accountId: d.accountId, toAccountId: d.type === 'transfer' ? d.toAccountId : '', note: d.note };
        if (p) Object.assign(byId(s.planned, p.id), data); else s.planned.push({ id: uid('p'), paid: {}, ...data });
      });
      toast(p ? 'Diperbarui' : 'Ditambahkan ke proyeksi');
    },
  });
};
Actions.payPlanned = (el) => {
  const p = byId(S().planned, el.dataset.id); const occ = el.dataset.occ; if (!p) return;
  if ((p.paid || {})[occ]) return toast('Sudah tercatat dibayar.');
  if (!S().accounts.length) return toast('Tambahkan akun dulu di tab Akun.', { type: 'bad' });
  const today = D.today();
  Actions.addTx(null, null, {
    type: p.type, amount: p.amount, categoryId: p.categoryId, accountId: p.accountId, toAccountId: p.toAccountId,
    date: occ <= today ? occ : today, desc: p.title,
    source: { kind: 'planned', id: p.id, occ },
    after: (s, tx) => { const x = byId(s.planned, p.id); (x.paid = x.paid || {})[occ] = tx.id; },
  });
};
Actions.skipPlanned = async (el) => {
  const p = byId(S().planned, el.dataset.id); const occ = el.dataset.occ; if (!p) return;
  if (await ask(`Lewati <b>${esc(p.title)}</b> tanggal ${D.fmt(occ)}? Item tidak lagi dihitung dalam proyeksi.`, { ok: 'Lewati', danger: false })) Store.update((s) => ((byId(s.planned, p.id).paid ||= {})[occ] = 'skip'));
};
Actions.unskipPlanned = (el) => Store.update((s) => { const p = byId(s.planned, el.dataset.id); if (p && p.paid[el.dataset.occ] === 'skip') delete p.paid[el.dataset.occ]; });
Actions.linkPlanned = async (el) => {
  const p = byId(S().planned, el.dataset.id), tx = byId(S().transactions, el.dataset.tx), occ = el.dataset.occ;
  if (!p || !tx) return;
  if (await ask(`Tautkan transaksi <b>${esc(tx.desc || '')}</b> (${rp(tx.amount)}, ${D.fmt(tx.date)}) sebagai pembayaran <b>${esc(p.title)}</b>? Item tidak akan dihitung lagi di proyeksi.`, { ok: 'Tautkan', danger: false }))
    Store.update((s) => { (byId(s.planned, p.id).paid ||= {})[occ] = tx.id; byId(s.transactions, tx.id).source = { kind: 'planned', id: p.id, occ }; });
};

/* ---------- target tabungan ---------- */
Actions.editGoal = (el) => {
  const g = el && el.dataset.id ? byId(S().goals, el.dataset.id) : null;
  Modal.open({
    title: g ? 'Ubah target' : 'Target tabungan baru',
    body: `<div class="form">
      ${F.text('name', 'Nama target', g?.name || '', { af: true, ph: 'mis. Dana darurat' })}
      ${F.money('target', 'Target nominal', g?.target ?? '')}
      ${F.date('deadline', 'Deadline (opsional)', g?.deadline || '')}
      ${F.money('monthly', 'Kontribusi rencana per bulan', g?.monthly ?? '', { help: 'Dipakai untuk estimasi waktu tercapai & dibandingkan dengan proyeksi tabungan.' })}
      ${F.select('accountId', 'Disimpan di akun (opsional)', Fin.accOptions(g?.accountId, { empty: true }))}
      ${g ? '' : F.money('initial', 'Sudah dialokasikan saat ini', '', { help: 'Uang yang sudah ada untuk target ini (dari tabungan yang sudah tercatat).' })}
    </div><p class="xs muted">Alokasi adalah penandaan uang tabungan untuk tujuan tertentu — bukan uang baru, sehingga tidak menambah total aset.</p>`,
    extraFooter: g ? `<button type="button" class="btn danger" data-del>Hapus</button>` : '',
    onOpen: (form, close) => {
      const del = form.querySelector('[data-del]');
      if (del) del.onclick = async () => { close(); if (await ask(`Hapus target <b>${esc(g.name)}</b>? Saldo akun tidak berubah.`, { ok: 'Hapus' })) Store.update((s) => (s.goals = s.goals.filter((x) => x.id !== g.id))); };
    },
    onSubmit: (d, form) => {
      if (!d.name) return fieldError(form, 'name', 'Nama wajib diisi.');
      const target = parseAmount(d.target); if (!(target > 0)) return fieldError(form, 'target', 'Isi target lebih dari Rp0.');
      if (d.deadline && !D.valid(d.deadline)) return fieldError(form, 'deadline', 'Tanggal tidak valid.');
      const monthly = parseAmount(d.monthly) || 0;
      Store.update((s) => {
        if (g) Object.assign(byId(s.goals, g.id), { name: d.name, target, deadline: d.deadline, monthly, accountId: d.accountId });
        else {
          const init = parseAmount(d.initial) || 0;
          s.goals.push({ id: uid('g'), name: d.name, target, deadline: d.deadline, monthly, accountId: d.accountId, allocations: init > 0 ? [{ id: uid('al'), date: D.today(), amount: init, note: 'Saldo awal target' }] : [], createdAt: Date.now() });
        }
      });
      toast('Target disimpan');
    },
  });
};
Actions.allocGoal = (el) => {
  const g = byId(S().goals, el.dataset.id); if (!g) return;
  Modal.open({
    title: 'Alokasi ke ' + g.name,
    body: `<div class="form">${F.money('amount', 'Nominal', '', { af: true })}${F.date('date', 'Tanggal', D.today())}${F.select('dir', 'Jenis', F.opts([['in', 'Tambah alokasi'], ['out', 'Tarik dari target']], 'in'))}${F.text('note', 'Catatan', '')}</div>
    <p class="xs muted">Jika Anda juga memindahkan uang ke rekening tabungan, catat sebagai <b>transfer</b> di Transaksi agar saldo akun ikut berubah.</p>`,
    onSubmit: (d, form) => {
      const a = parseAmount(d.amount); if (!(a > 0)) return fieldError(form, 'amount', 'Isi nominal.');
      if (!D.valid(d.date)) return fieldError(form, 'date', 'Tanggal tidak valid.');
      Store.update((s) => byId(s.goals, g.id).allocations.push({ id: uid('al'), date: d.date, amount: d.dir === 'out' ? -a : a, note: d.note }));
      toast('Alokasi dicatat');
    },
  });
};

const FIN_TABS = [['ringkasan', 'Ringkasan'], ['transaksi', 'Transaksi'], ['akun', 'Akun'], ['budget', 'Budget'], ['proyeksi', 'Proyeksi'], ['tagihan', 'Tagihan & rencana'], ['target', 'Target'], ['laporan', 'Laporan']];

Actions.finTab = (el) => { UIFin.tab = el.dataset.tab; App.render(); };

function accountsBand() {

function budgetMini(b) {
  if (!b.rows.some((r) => r.total)) return empty('target', 'Belum ada budget', 'Tetapkan batas bulanan per kategori untuk memantau pengeluaran.', `<button class="btn sm" data-act="editBudgets">Atur budget</button>`);
  const pct = b.totalBudget ? b.totalUsed / b.totalBudget : 0;
  return `<div class="stack">
    <div class="row between"><span class="small muted">Terpakai ${rp(b.totalUsed)} dari ${rp(b.totalBudget)}</span><b class="num ${b.totalBudget - b.totalUsed < 0 ? 'neg' : ''}">Sisa ${rp(b.totalBudget - b.totalUsed)}</b></div>
    <div class="bar ${barTone(pct)}"><i style="width:${clamp(pct * 100, 0, 100)}%"></i></div>
    <div class="list">${b.rows.filter((r) => r.total).sort((x, y) => y.pct - x.pct).slice(0, 5).map((r) => `<div class="li"><div class="main-col"><div class="row between"><span class="t small">${Cat.dot('expense', r.cat.id)} ${esc(r.cat.name)}</span><span class="small num">${rp(r.used)} / ${rp(r.total)}</span></div><div class="bar thin ${barTone(r.pct)}" style="margin-top:6px"><i style="width:${clamp(r.pct * 100, 0, 100)}%"></i></div></div></div>`).join('')}</div>
  </div>`;
}
const barTone = (p) => (p >= 1 ? 'bad' : p >= 0.8 ? 'warn' : 'good');

const txSort = (mode) => ({
  'date-desc': (a, b) => (a.date === b.date ? (b.createdAt || 0) - (a.createdAt || 0) : a.date < b.date ? 1 : -1),
  'date-asc': (a, b) => (a.date === b.date ? (a.createdAt || 0) - (b.createdAt || 0) : a.date < b.date ? -1 : 1),
  'amt-desc': (a, b) => b.amount - a.amount,
  'amt-asc': (a, b) => a.amount - b.amount,
}[mode]);

function txRow(t) {
  const isT = t.type === 'transfer';
  const ic = isT ? 'swap' : t.type === 'income' ? 'arrowin' : 'arrowout';
  const color = isT ? 'var(--info)' : Cat.color(t.type === 'income' ? 'income' : 'expense', t.categoryId);
  const title = t.desc || (isT ? 'Transfer' : Cat.name(t.type === 'income' ? 'income' : 'expense', t.categoryId));
  return `<div class="li">
    <div class="ic-circle" style="color:${color};background:color-mix(in srgb,${color} 16%,transparent)">${icon(ic, 'ico-sm')}</div>
    <div class="main-col"><div class="t">${esc(title)}${demoTag(t)}${t.adjust ? ' <span class="pill">Penyesuaian</span>' : ''}${t.source?.kind === 'planned' ? ' <span class="pill info">Tagihan</span>' : ''}${t.source?.kind === 'shopping' ? ' <span class="pill info">Belanja</span>' : ''}</div>
      <div class="s"><span>${D.fmt(t.date)}</span><span>${isT ? `${esc(Fin.accName(t.accountId))} → ${esc(Fin.accName(t.toAccountId))}` : esc(Cat.name(t.type === 'income' ? 'income' : 'expense', t.categoryId)) + ' · ' + esc(Fin.accName(t.accountId))}</span>${t.note ? `<span>· ${esc(t.note)}</span>` : ''}</div></div>
    <b class="num ${isT ? '' : t.type === 'income' ? 'pos' : 'neg'}">${isT ? '' : t.type === 'income' ? '+' : '−'}${rp(t.amount)}</b>
    <div class="acts"><button class="btn icon ghost" data-act="editTx" data-id="${t.id}" aria-label="Ubah">${icon('edit', 'ico-sm')}</button><button class="btn icon ghost" data-act="deleteTx" data-id="${t.id}" aria-label="Hapus">${icon('trash', 'ico-sm')}</button></div>
  </div>`;
}
function txList(list) {
  if (!list.length) return empty('wallet', 'Belum ada transaksi', 'Catat pemasukan, pengeluaran, atau transfer pertama Anda.', `<button class="btn sm primary" data-act="addTx">Catat transaksi</button>`);
  return `<div class="list">${list.map(txRow).join('')}</div>`;
}

function filteredTx() {
  const q = UIFin.q.toLowerCase();
  let list = S().transactions.filter((t) => {
    if (UIFin.month && UIFin.month !== 'all' && !UIFin.fFrom && !UIFin.fTo && D.month(t.date) !== UIFin.month) return false;
    if (UIFin.fFrom && t.date < UIFin.fFrom) return false;
    if (UIFin.fTo && t.date > UIFin.fTo) return false;
    if (UIFin.fType && t.type !== UIFin.fType) return false;
    if (UIFin.fAcc && t.accountId !== UIFin.fAcc && t.toAccountId !== UIFin.fAcc) return false;
    if (UIFin.fCat && t.categoryId !== UIFin.fCat) return false;
    if (q) {
      const hay = [t.desc, t.note, Cat.name(t.type === 'income' ? 'income' : 'expense', t.categoryId), Fin.accName(t.accountId), String(t.amount)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return list.sort(txSort(UIFin.sort));
}
function finTransactions(el) {
  const list = filteredTx();
  const fl = { inc: sum(list.filter((t) => t.type === 'income' && !t.adjust), (t) => t.amount), exp: sum(list.filter((t) => t.type === 'expense' && !t.adjust), (t) => t.amount) };
  const today = D.today(), ws = D.weekStart(today);

  const months = Array.from(new Set(S().transactions.map((t) => D.month(t.date)).concat([D.month(today)]))).sort().reverse();
  const allCats = [...Cat.list('expense').map((c) => [c.id, 'Keluar · ' + c.name]), ...Cat.list('income').map((c) => [c.id, 'Masuk · ' + c.name])];
  el.innerHTML = `
  <div class="grid g3">
    ${[['Hari ini', sumD], ['Minggu ini (Sen–Min)', sumW], ['Bulan ini', sumM]].map(([l, f]) => `<div class="card"><div class="label">${l}</div><div class="row between" style="margin-top:6px"><span class="small muted">Masuk</span><b class="num pos">${rp(f.inc)}</b></div><div class="row between"><span class="small muted">Keluar</span><b class="num neg">${rp(f.exp)}</b></div><div class="row between"><span class="small muted">Selisih</span><b class="num">${rp(f.net, { sign: true })}</b></div></div>`).join('')}
  </div>
  <div class="card stack">
    <div class="filters">
      <input class="input search" type="search" placeholder="Cari deskripsi, kategori, nominal…" value="${esc(UIFin.q)}" data-fin-filter="q" aria-label="Cari transaksi">
      <select class="input" data-fin-filter="month" aria-label="Bulan">${F.opts([['all', 'Semua bulan'], ...months.map((m) => [m, D.monthName(m)])], UIFin.month)}</select>
      <select class="input" data-fin-filter="fType" aria-label="Jenis">${F.opts([['', 'Semua jenis'], ['income', 'Pemasukan'], ['expense', 'Pengeluaran'], ['transfer', 'Transfer']], UIFin.fType)}</select>
      <select class="input" data-fin-filter="fAcc" aria-label="Akun"><option value="">Semua akun</option>${S().accounts.map((a) => `<option value="${a.id}" ${a.id === UIFin.fAcc ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <select class="input" data-fin-filter="fCat" aria-label="Kategori">${F.opts([['', 'Semua kategori'], ...allCats], UIFin.fCat)}</select>
      <input class="input" type="date" value="${UIFin.fFrom}" data-fin-filter="fFrom" aria-label="Dari tanggal" title="Dari tanggal">
      <input class="input" type="date" value="${UIFin.fTo}" data-fin-filter="fTo" aria-label="Sampai tanggal" title="Sampai tanggal">
      <select class="input" data-fin-filter="sort" aria-label="Urutkan">${F.opts([['date-desc', 'Terbaru'], ['date-asc', 'Terlama'], ['amt-desc', 'Nominal terbesar'], ['amt-asc', 'Nominal terkecil']], UIFin.sort)}</select>
      ${UIFin.q || UIFin.fType || UIFin.fAcc || UIFin.fCat || UIFin.fFrom || UIFin.fTo ? `<button class="btn sm ghost" data-act="finClearFilter">Reset filter</button>` : ''}
    </div>
    <div class="row between"><span class="small muted">${list.length} transaksi · masuk <b class="pos num">${rp(fl.inc)}</b> · keluar <b class="neg num">${rp(fl.exp)}</b></span>
      <div class="row"><button class="btn sm" data-act="exportTx" data-fmt="csv">${icon('down', 'ico-sm')} CSV</button><button class="btn sm" data-act="exportTx" data-fmt="xlsx">${icon('down', 'ico-sm')} Excel</button><button class="btn sm" data-act="importExcel">${icon('upload', 'ico-sm')} Impor Excel</button><button class="btn sm primary" data-act="addTx">${icon('plus', 'ico-sm')} Catat</button></div></div>
    ${groupedTx(list.slice(0, UIFin.limit))}
    ${list.length > UIFin.limit ? `<button class="btn" data-act="finMore">Tampilkan ${Math.min(150, list.length - UIFin.limit)} lagi</button>` : ''}
  </div>`;
}
function groupedTx(list) {
  if (!list.length) return S().transactions.length ? empty('search', 'Tidak ada yang cocok', 'Ubah kata kunci atau filter.') : txList([]);
  if (!UIFin.sort.startsWith('date')) return txList(list);
  const groups = [];
  for (const t of list) { const g = groups[groups.length - 1]; if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] }); }
  return groups.map((g) => {
    const out = sum(g.items.filter((t) => t.type === 'expense' && !t.adjust), (t) => t.amount);
    return `<div><div class="row between" style="padding:10px 4px 2px"><span class="label">${D.fmt(g.date, { weekday: 'long', day: 'numeric', month: 'long' })}</span>${out ? `<span class="small muted num">keluar ${rp(out)}</span>` : ''}</div><div class="list">${g.items.map(txRow).join('')}</div></div>`;
  }).join('');
}
Actions.finMore = () => { UIFin.limit += 150; App.render(); };
Actions.finClearFilter = () => { Object.assign(UIFin, { q: '', fType: '', fAcc: '', fCat: '', fFrom: '', fTo: '' }); App.render(); };

    : `<div class="card">${empty('wallet', 'Belum ada sumber dana', 'Tambahkan uang tunai, rekening bank, e-wallet, atau tabungan beserta saldo awalnya.', `<button class="btn primary" data-act="editAccount">Tambah akun</button>`)}</div>`}`;
}

function finBudget(el) {
  const key = UIFin.month && UIFin.month !== 'all' ? UIFin.month : D.month(D.today());
  const b = Fin.budgetSummary(key);
  const isCur = key === D.month(D.today());
  const dayFrac = isCur ? Number(D.today().slice(8)) / D.daysIn(key) : 1;
  el.innerHTML = `
  <div class="row between"><div class="row"><button class="btn icon" data-act="finMonth" data-d="-1" aria-label="Bulan sebelumnya">${icon('left')}</button><h2 style="min-width:150px;text-align:center">${D.monthName(key)}</h2><button class="btn icon" data-act="finMonth" data-d="1" aria-label="Bulan berikutnya">${icon('right')}</button></div>

  <div class="grid g3">
    <div class="card"><div class="label">Total budget</div><div class="stat"><span class="v num">${rp(b.totalBudget)}</span>${S().settings.rolloverEnabled ? '<span class="hint">termasuk rollover</span>' : ''}</div></div>
    <div class="card"><div class="label">Terpakai</div><div class="stat"><span class="v num">${rp(b.totalUsed)}</span><span class="hint">${Math.round((b.totalBudget ? b.totalUsed / b.totalBudget : 0) * 100)}% · waktu berjalan ${Math.round(dayFrac * 100)}%</span></div></div>
    <div class="card"><div class="label">Sisa budget</div><div class="stat"><span class="v num ${b.totalBudget - b.totalUsed < 0 ? 'neg' : 'pos'}">${rp(b.totalBudget - b.totalUsed)}</span>${b.unbudgetedUsed ? `<span class="hint">+ ${rp(b.unbudgetedUsed)} di kategori tanpa budget</span>` : ''}</div></div>
  </div>
  <div class="card">${b.rows.map((r) => {

    return `<div class="budget-row"><div><div style="font-weight:650">${Cat.dot('expense', r.cat.id)} ${esc(r.cat.name)}</div><div class="xs muted">${r.total ? `Budget ${rp(r.base)}${r.carry ? ` + rollover ${rp(r.carry)}` : ''}` : ''}</div></div>
      <div class="bcol">${r.total ? `<div class="bar ${barTone(r.pct)}"><i style="width:${clamp(r.pct * 100, 0, 100)}%"></i></div><div class="row between xs muted" style="margin-top:4px"><span>${rp(r.used)} terpakai (${Math.round(r.pct * 100)}%)</span><span>${r.left >= 0 ? 'sisa ' + rp(r.left) : 'lebih ' + rp(-r.left)}</span></div>` : `<div class="xs muted">${rp(r.used)} terpakai</div>`}</div>
      <div>${st}</div></div>`;
  }).join('')}</div>` : `<div class="card">${empty('target', 'Belum ada budget', 'Tetapkan nilai budget per kategori. Rollover sisa bulan lalu bisa diaktifkan, tetapi tidak menyala otomatis.', `<button class="btn primary" data-act="editBudgets">Atur budget</button>`)}</div>`}`;
}

    <div class="ln"><span>Status</span><b>${pr.savGain >= pr.goalMonthly ? '<span class="pill good">Sesuai target</span>' : `<span class="pill warn">Kurang ${rp(pr.goalMonthly - pr.savGain)}</span>`}</b></div>` : `<div class="ln"><span class="muted small">Isi "kontribusi per bulan" di tab Target untuk membandingkan dengan target tabungan.</span></div>`;

  el.innerHTML = `
  <div class="banner">${icon('info', 'ico-sm')}<span>Proyeksi untuk <b>${D.monthName(key)}</b>, dihitung per ${D.long(pr.asOf)} (WIB). Transaksi aktual dan rencana dipisah: rencana tidak mengubah saldo sampai dibayar, dan tagihan yang sudah dibayar tidak dihitung lagi.</span></div>

        ${pr.adj ? `<div class="ln"><span><span class="op">±</span>Penyesuaian saldo</span><b class="num">${rp(pr.adj, { sign: true })}</b></div>` : ''}
        <div class="ln" style="font-weight:650"><span>= Saldo saat ini</span><b class="num">${rp(pr.now.spendable)}</b></div>
        <div class="ln"><span><span class="op">+</span>Pemasukan diharapkan (belum diterima)</span><b class="num pos">${rp(pr.pe.inc + pr.pe.fromSav)}</b></div>
        <div class="ln"><span><span class="op">−</span>Tagihan & pengeluaran terencana belum dibayar</span><b class="num neg">${rp(pr.pe.exp)}</b></div>
        ${pr.pe.toSav ? `<div class="ln"><span><span class="op">−</span>Rencana menabung (transfer ke tabungan)</span><b class="num">${rp(pr.pe.toSav)}</b></div>` : ''}
        <div class="ln total"><span>Proyeksi A · berdasarkan rencana</span><b class="num ${pr.planEnd < 0 ? 'neg' : ''}">${rp(pr.planEnd)}</b></div>
        <div class="ln"><span><span class="op">−</span>Estimasi pengeluaran harian sisa ${pr.remaining} hari (${rp(Math.round(pr.avg))}/hari)</span><b class="num neg">${rp(pr.projVar)}</b></div>
        <div class="ln total"><span>Proyeksi B · rencana + pola pengeluaran</span><b class="num ${pr.patternEnd < 0 ? 'neg' : ''}">${pr.limited ? '<span class="pill warn">Data terbatas</span> ' : ''}${rp(pr.patternEnd)}</b></div>
      </div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Tabungan</h3></div>
        <div class="ledger">
          <div class="ln"><span>Saldo tabungan awal bulan</span><b class="num">${rp(pr.start.savings)}</b></div>
          <div class="ln"><span>Saldo tabungan saat ini</span><b class="num">${rp(pr.now.savings)}</b></div>

function plannedList(occs, compact) {
  if (!occs.length) return empty('bell', 'Tidak ada tagihan atau rencana', 'Tambahkan tagihan (kos, listrik, langganan) atau pemasukan yang diharapkan (uang bulanan, beasiswa).', `<button class="btn sm" data-act="editPlanned">Tambah</button>`);
  const month = (d) => D.month(d);
  return `<div class="list">${occs.map((o) => {
    const p = o.p;
    const clr = p.type === 'income' ? 'pos' : p.type === 'expense' ? 'neg' : '';
    // saran tautan: transaksi aktual dengan kategori & nominal sama di bulan yang sama yang belum tertaut
    let hint = '';
    if (o.status !== 'paid' && o.status !== 'skip' && p.type !== 'transfer') {
      const m = S().transactions.find((t) => t.type === p.type && t.amount === p.amount && t.categoryId === p.categoryId && month(t.date) === month(o.date) && !(t.source && t.source.kind === 'planned'));
      if (m) hint = `<button class="btn sm ghost" data-act="linkPlanned" data-id="${p.id}" data-occ="${o.date}" data-tx="${m.id}" title="Ada transaksi serupa ${D.fmt(m.date)}">${icon('link', 'ico-sm')} Sudah dibayar?</button>`;
    }
    const st = o.status === 'paid' ? '<span class="pill good">Dibayar</span>' : o.status === 'skip' ? '<span class="pill">Dilewati</span>' : o.status === 'overdue' ? '<span class="pill bad">Lewat jatuh tempo</span>' : D.diff(D.today(), o.date) <= 3 ? '<span class="pill warn">Segera</span>' : '';
    return `<div class="li">
      <div class="ic-circle">${icon(p.kind === 'bill' ? 'bell' : p.type === 'income' ? 'arrowin' : p.type === 'transfer' ? 'swap' : 'arrowout', 'ico-sm')}</div>
      <div class="main-col"><div class="t">${esc(p.title)}${demoTag(p)}</div><div class="s"><span>${D.fmt(o.date, { weekday: 'short', day: 'numeric', month: 'short' })}</span>${recLabel(p.rec) ? `<span>· ${recLabel(p.rec)}</span>` : ''}<span>· ${p.type === 'transfer' ? esc(Fin.accName(p.accountId)) + ' → ' + esc(Fin.accName(p.toAccountId)) : esc(Cat.name(p.type === 'income' ? 'income' : 'expense', p.categoryId))}</span>${st}</div></div>
      <b class="num ${clr}">${rp(p.amount)}</b>
      <div class="row" style="gap:4px">${hint}${o.status === 'paid' ? '' : o.status === 'skip' ? `<button class="btn sm ghost" data-act="unskipPlanned" data-id="${p.id}" data-occ="${o.date}">Batalkan lewati</button>` : `<button class="btn sm primary" data-act="payPlanned" data-id="${p.id}" data-occ="${o.date}">${p.type === 'income' ? 'Terima' : 'Bayar'}</button>${compact ? '' : `<button class="btn sm ghost" data-act="skipPlanned" data-id="${p.id}" data-occ="${o.date}">Lewati</button>`}`}
      <button class="btn icon ghost" data-act="editPlanned" data-id="${p.id}" aria-label="Ubah">${icon('edit', 'ico-sm')}</button></div>
    </div>`;
  }).join('')}</div>`;
}

function finPlanned(el) {
  const today = D.today();
  const from = D.add(today, -31), to = D.add(today, 62);
  const occ = Fin.plannedOcc(from, to, { includePaid: true });
  const upcoming = occ.filter((o) => o.status === 'due' || o.status === 'overdue');
  const past = occ.filter((o) => o.status === 'paid' || o.status === 'skip').reverse().slice(0, 20);
  el.innerHTML = `
  <div class="row between"><p class="small muted" style="max-width:70ch">Masukkan kewajiban dan pemasukan yang <b>belum terjadi</b>. Saat dibayar/diterima, klik tombolnya — transaksi aktual dibuat sekali dan item ini ditandai lunas.</p>
  <div class="row"><button class="btn" data-act="editPlanned" data-kind="plan">${icon('plus', 'ico-sm')} Rencana</button><button class="btn primary" data-act="editPlannedBill">${icon('plus', 'ico-sm')} Tagihan</button></div></div>
  <div class="card"><div class="card-h"><h3>Akan datang (60 hari)</h3><span class="sub">${upcoming.length} item · ${rp(sum(upcoming.filter((o) => o.p.type === 'expense'), (o) => o.p.amount))} keluar</span></div>${plannedList(upcoming)}</div>
  <div class="card"><div class="card-h"><h3>Semua tagihan & rencana</h3></div>${S().planned.length ? `<div class="list">${S().planned.map((p) => `<div class="li"><div class="main-col"><div class="t">${esc(p.title)}${demoTag(p)}</div><div class="s">${p.kind === 'bill' ? 'Tagihan' : 'Rencana'} · ${TX_TYPES[p.type]} · mulai ${D.fmt(p.date)}${recLabel(p.rec) ? ' · ' + recLabel(p.rec) : ''}${p.rec?.until ? ' s.d. ' + D.fmt(p.rec.until) : ''}</div></div><b class="num">${rp(p.amount)}</b><button class="btn icon ghost" data-act="editPlanned" data-id="${p.id}" aria-label="Ubah">${icon('edit', 'ico-sm')}</button></div>`).join('')}</div>` : '<p class="small muted">Belum ada.</p>'}</div>
  ${past.length ? `<div class="card"><div class="card-h"><h3>Riwayat 30 hari terakhir</h3></div>${plannedList(past)}</div>` : ''}`;
}
Actions.editPlannedBill = () => Actions.editPlanned(null, null, { kind: 'bill', type: 'expense' });

function finGoals(el) {

  <div class="row between"><p class="small muted" style="max-width:70ch">Target adalah alokasi dari uang tabungan yang sudah ada. Total dialokasikan: <b class="num">${rp(allocated)}</b> dari tabungan <b class="num">${rp(savings)}</b>.</p><button class="btn primary" data-act="editGoal">${icon('plus', 'ico-sm')} Target baru</button></div>
  ${allocated > savings && savings >= 0 && goals.length ? `<div class="banner warn">${icon('alert', 'ico-sm')}<span>Alokasi target (${rp(allocated)}) melebihi saldo akun tabungan (${rp(savings)}). Periksa apakah ada uang target yang disimpan di akun "siap pakai", atau kurangi alokasi.</span></div>` : ''}
  ${goals.length ? `<div class="grid g2">${goals.map((g) => {
    const st = Fin.goalStatus(g);
    const tone = { done: 'good', ontrack: 'good', behind: 'warn', late: 'bad', unknown: '' }[st.state];
    return `<div class="card stack">
      <div class="row between"><div><h3>${esc(g.name)}${demoTag(g)}</h3><div class="xs muted">${g.deadline ? 'Deadline ' + D.fmt(g.deadline) : 'Tanpa deadline'}${g.accountId ? ' · di ' + esc(Fin.accName(g.accountId)) : ''}</div></div><span class="pill ${tone}">${esc(st.note)}</span></div>
      <div class="row between"><span class="stat"><span class="v num">${rp(st.alloc)}</span><span class="hint">dari ${rp(g.target)} · ${Math.round(st.pct * 100)}%</span></span><span class="small muted" style="text-align:right">Kontribusi ${rp(g.monthly || 0)}/bln<br>${st.monthsNeeded ? `±${st.monthsNeeded} bulan lagi` : ''}</span></div>
      <div class="bar ${tone}"><i style="width:${clamp(st.pct * 100, 0, 100)}%"></i></div>
      <div class="chart-box sm"><canvas id="chGoal_${g.id}"></canvas></div>
      <div class="row"><button class="btn sm primary" data-act="allocGoal" data-id="${g.id}">${icon('plus', 'ico-sm')} Alokasi</button><button class="btn sm" data-act="editGoal" data-id="${g.id}">Ubah</button></div>
    </div>`;
  }).join('')}</div>` : `<div class="card">${empty('target', 'Belum ada target tabungan', 'Contoh: dana darurat, biaya pendidikan, laptop baru.', `<button class="btn primary" data-act="editGoal">Buat target</button>`)}</div>`}`;
  goals.forEach(drawGoalChart);
}

function finReports(el) {
  const key = UIFin.repMonth || D.month(D.today());
  const prev = D.prevMonth(key);
  const cur = Fin.spentByCat(D.monthStart(key), D.monthEnd(key)), pv = Fin.spentByCat(D.monthStart(prev), D.monthEnd(prev));
  const f = Fin.monthFlows(key), fp = Fin.monthFlows(prev);
  const cats = Cat.list('expense').filter((c) => cur[c.id] || pv[c.id]);
  const delta = (a, b) => (b ? Math.round(((a - b) / b) * 100) : a ? 100 : 0);
  el.innerHTML = `
  <div class="row between"><div class="row"><button class="btn icon" data-act="repMonth" data-d="-1" aria-label="Bulan sebelumnya">${icon('left')}</button><h2 style="min-width:150px;text-align:center">${D.monthName(key)}</h2><button class="btn icon" data-act="repMonth" data-d="1" aria-label="Bulan berikutnya">${icon('right')}</button></div>
  <div class="row"><button class="btn" data-act="exportReport">${icon('down', 'ico-sm')} Laporan Excel</button><button class="btn" data-act="exportTx" data-fmt="csv" data-all="1">${icon('down', 'ico-sm')} Semua transaksi CSV</button></div></div>
  <div class="grid g3">
    <div class="card"><div class="label">Pemasukan</div><div class="stat"><span class="v num pos">${rp(f.inc)}</span><span class="hint">bulan lalu ${rp(fp.inc)}</span></div></div>
    <div class="card"><div class="label">Pengeluaran</div><div class="stat"><span class="v num neg">${rp(f.exp)}</span><span class="hint">bulan lalu ${rp(fp.exp)} (${delta(f.exp, fp.exp) >= 0 ? '+' : ''}${delta(f.exp, fp.exp)}%)</span></div></div>
    <div class="card"><div class="label">Selisih</div><div class="stat"><span class="v num">${rp(f.net, { sign: true })}</span><span class="hint">bulan lalu ${rp(fp.net, { sign: true })}</span></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h3>Pengeluaran harian</h3></div><div class="chart-box"><canvas id="chDaily"></canvas></div></div>
    <div class="card"><div class="card-h"><h3>Per kategori</h3></div>${catChartBlock('chRepCat', key)}</div>
  </div>
  <div class="card"><div class="card-h"><h3>Tren 12 bulan</h3><span class="sub">pemasukan, pengeluaran, selisih</span></div><div class="chart-box lg"><canvas id="chTrend"></canvas></div></div>
  <div class="card"><div class="card-h"><h3>Perbandingan dengan ${D.monthName(prev)}</h3></div>
  ${cats.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th class="r">${D.monthName(prev)}</th><th class="r">${D.monthName(key)}</th><th class="r">Perubahan</th></tr></thead><tbody>
  ${cats.map((c) => { const a = cur[c.id] || 0, b = pv[c.id] || 0; return `<tr><td>${Cat.dot('expense', c.id)} ${esc(c.name)}</td><td class="r num">${rp(b)}</td><td class="r num">${rp(a)}</td><td class="r num ${a > b ? 'neg' : a < b ? 'pos' : ''}">${rp(a - b, { sign: true })}${b ? ` (${delta(a, b) >= 0 ? '+' : ''}${delta(a, b)}%)` : ''}</td></tr>`; }).join('')}
  <tr><td><b>Total</b></td><td class="r num"><b>${rp(fp.exp)}</b></td><td class="r num"><b>${rp(f.exp)}</b></td><td class="r num"><b>${rp(f.exp - fp.exp, { sign: true })}</b></td></tr>
  </tbody></table></div>` : '<p class="small muted">Belum ada pengeluaran di dua bulan ini.</p>'}</div>`;
  drawCatChart('chRepCat', key);
  drawDaily('chDaily', key);
  drawTrend('chTrend', key);
}
Actions.repMonth = (el) => { UIFin.repMonth = D.addMonths((UIFin.repMonth || D.month(D.today())) + '-01', Number(el.dataset.d)).slice(0, 7); App.render(); };

/* ---------- grafik ---------- */
const Charts = { inst: {} };
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mkChart(id, cfg) {
  const cv = document.getElementById(id); if (!cv) return;
  if (Charts.inst[id]) { try { Charts.inst[id].destroy(); } catch { } delete Charts.inst[id]; }
  if (!window.Chart) {
    const box = cv.parentElement;
    if (!box.querySelector('.chart-fallback')) box.insertAdjacentHTML('beforeend', `<div class="chart-fallback">Grafik belum bisa dimuat (pustaka Chart.js memerlukan internet saat pertama dibuka).</div>`);
    return;
  }
  const fg = cssVar('--muted'), grid = cssVar('--line');
  Chart.defaults.color = fg; Chart.defaults.borderColor = grid;
  Chart.defaults.font.family = cssVar('--f-body') || 'sans-serif';
  Charts.inst[id] = new Chart(cv, cfg);
}
function catChartBlock(id, key) {
  const m = Fin.spentByCat(D.monthStart(key), D.monthEnd(key));
  const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return empty('chart', 'Belum ada pengeluaran', 'Grafik muncul setelah ada transaksi pengeluaran bulan ini.');
  const tot = sum(rows, (r) => r[1]);
  return `<div class="grid g2" style="align-items:center"><div class="chart-box sm"><canvas id="${id}"></canvas></div>
    <div class="legend">${rows.slice(0, 7).map(([c, v]) => `<div class="li"><span class="swatch" style="background:${Cat.color('expense', c)}"></span><span class="main-col small">${esc(Cat.name('expense', c))}</span><span class="small num">${rp(v)}</span><span class="xs muted num" style="width:34px;text-align:right">${Math.round((v / tot) * 100)}%</span></div>`).join('')}${rows.length > 7 ? `<div class="xs muted">+${rows.length - 7} kategori lain</div>` : ''}</div></div>`;
}
function drawCatChart(id, key) {
  const m = Fin.spentByCat(D.monthStart(key), D.monthEnd(key));
  const rows = Object.entries(m).sort((a, b) => b[1] - a[1]); if (!rows.length) return;
  mkChart(id, { type: 'doughnut', data: { labels: rows.map((r) => Cat.name('expense', r[0])), datasets: [{ data: rows.map((r) => r[1]), backgroundColor: rows.map((r) => Cat.color('expense', r[0])), borderColor: cssVar('--surface'), borderWidth: 2 }] }, options: { maintainAspectRatio: false, cutout: '64%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + rp(c.parsed) } } } } });
}
function drawDaily(id, key) {
  const days = D.range(D.monthStart(key), D.monthEnd(key));
  const m = {}; for (const t of S().transactions) if (t.type === 'expense' && !t.adjust && D.month(t.date) === key) m[t.date] = (m[t.date] || 0) + t.amount;

/* =========================================================
   TASKS ENGINE — satu daftar tugas dipakai Planner, Kalender, Proyek, Rumah
   Tugas berulang: satu entri dengan pola, penyelesaian per tanggal di doneDates
   ========================================================= */
const PRIO = { high: 'Tinggi', med: 'Sedang', low: 'Rendah' };
const PRIO_ORDER = { high: 0, med: 1, low: 2 };
const TSTATUS = { todo: 'Belum', doing: 'Dikerjakan', done: 'Selesai' };

const Tasks = {
  isRec: (t) => t.rec && t.rec.freq && t.rec.freq !== 'none',
  doneOn(t, day) { return Tasks.isRec(t) ? !!(t.doneDates || {})[day] : t.status === 'done'; },
  /** instans tugas pada satu tanggal (tugas biasa + kejadian tugas berulang) */
  on(day) {
    const out = [];
    for (const t of S().tasks) {
      if (Tasks.isRec(t)) { if (occursOn(t.date, t.rec, day)) out.push({ t, date: day, done: Tasks.doneOn(t, day), rec: true }); }
      else if (t.date === day) out.push({ t, date: day, done: t.status === 'done', rec: false });
    }
    return out;
  },
  /** tugas sekali yang tanggal kerjanya lewat atau deadline lewat dan belum selesai */
  overdue() {
    const today = D.today();
    return S().tasks.filter((t) => !Tasks.isRec(t) && t.status !== 'done' && ((t.date && t.date < today) || (!t.date && t.deadline && t.deadline < today)));
  },
  /** kejadian rutinitas yang terlewat (7 hari ke belakang) */
  missedRoutines(days = 7) {
    const today = D.today(), out = [];
    for (const t of S().tasks) if (Tasks.isRec(t)) for (const d of occurrences(t.date, t.rec, D.add(today, -days), D.add(today, -1))) if (!Tasks.doneOn(t, d) && !(t.skipDates || {})[d]) out.push({ t, date: d, done: false, rec: true });
    return out;
  },
  open() { return S().tasks.filter((t) => !Tasks.isRec(t) && t.status !== 'done'); },
  dueSoon(days = 3) {
    const today = D.today(), lim = D.add(today, days);
    return S().tasks.filter((t) => !Tasks.isRec(t) && t.status !== 'done' && t.deadline && t.deadline >= today && t.deadline <= lim).sort((a, b) => (a.deadline < b.deadline ? -1 : 1));
  },
  sortInst(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const ta = a.t.time || '99', tb = b.t.time || '99';
    if (ta !== tb) return ta < tb ? -1 : 1;
    return PRIO_ORDER[a.t.priority || 'med'] - PRIO_ORDER[b.t.priority || 'med'];
  },
};

Actions.toggleTask = (el) => {
  const id = el.dataset.id, day = el.dataset.date;
  let nowDone;
  Store.update((s) => {
    const t = byId(s.tasks, id); if (!t) return;
    if (Tasks.isRec(t)) { t.doneDates = t.doneDates || {}; if (t.doneDates[day]) delete t.doneDates[day]; else t.doneDates[day] = true; nowDone = !!t.doneDates[day]; }
    else { t.status = t.status === 'done' ? 'todo' : 'done'; t.completedAt = t.status === 'done' ? Date.now() : null; nowDone = t.status === 'done'; }
  });
  if (nowDone) toast('Tugas selesai ✓');
};
Actions.setTaskStatus = (el) => Store.update((s) => { const t = byId(s.tasks, el.dataset.id); if (t) { t.status = el.dataset.status; t.completedAt = t.status === 'done' ? Date.now() : null; } });

function readTask(d, form) {
  if (!d.title) return fieldError(form, 'title', 'Nama tugas wajib diisi.');
  if (d.date && !D.valid(d.date)) return fieldError(form, 'date', 'Tanggal tidak valid.');
  if (d.deadline && !D.valid(d.deadline)) return fieldError(form, 'deadline', 'Tanggal tidak valid.');
  if (d.date && d.deadline && d.deadline < d.date) return fieldError(form, 'deadline', 'Deadline lebih awal dari tanggal pengerjaan.');
  const rec = readRecurrence(d);
  if (rec.freq !== 'none' && !d.date) return fieldError(form, 'date', 'Tugas berulang butuh tanggal mulai.');
  if (rec.freq === 'days' && !(rec.days || []).length) return fieldError(form, 'rfreq', 'Pilih minimal satu hari.');
  return { title: d.title, date: d.date, time: d.time, deadline: d.deadline, duration: Number(d.duration) || 0, priority: d.priority, categoryId: d.categoryId, status: d.status, projectId: d.projectId, rec, desc: d.desc, note: d.note };
}
Actions.addTask = (el, ev, preset = {}) => {

};
Actions.editTask = (el) => {

Actions.dupTask = (el) => {

Actions.deleteTask = async (el) => {

/** jadwalkan ulang: tugas biasa → ganti tanggal; kejadian rutinitas → salinan sekali di tanggal baru */
Actions.moveTask = (el) => {

    <div class="form">${F.date('date', 'Tanggal baru', D.today())}${F.time('time', 'Jam', t.time || '')}</div>`,
    submit: 'Pindahkan',

/* =========================================================
   PLANNER VIEW
   ========================================================= */
const UIPlan = { view: 'today', day: null, cat: '', prio: '', status: '', q: '' };
Actions.planView = (el) => { UIPlan.view = el.dataset.v; App.render(); };
Actions.planDay = (el) => { UIPlan.day = el.dataset.d === 'today' ? D.today() : D.add(UIPlan.day || D.today(), Number(el.dataset.d)); UIPlan.view = 'today'; App.render(); };
document.addEventListener('change', (e) => { const k = e.target.dataset?.planFilter; if (k) { UIPlan[k] = e.target.value; App.render(); } });
document.addEventListener('input', (e) => { if (e.target.dataset?.planFilter === 'q') { UIPlan.q = e.target.value; clearTimeout(UIPlan._t); UIPlan._t = setTimeout(() => { App.render(); const s = $('[data-plan-filter=q]'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 220); } });

/* =========================================================
   ACADEMIC & PROJECT MANAGER
   Subtugas proyek = tugas biasa dengan projectId (tanpa duplikasi data)
   ========================================================= */
const PSTATUS = { planning: 'Perencanaan', active: 'Berjalan', paused: 'Ditunda', done: 'Selesai' };
const MSTATUS = { todo: 'Belum', doing: 'Berjalan', done: 'Selesai' };
const TA_STAGES = ['Penentuan topik', 'Studi literatur', 'Pengumpulan data', 'Pengolahan data', 'Pemodelan', 'Validasi', 'Analisis hasil', 'Penulisan', 'Revisi', 'Persiapan sidang'];
const Proj = {
  tasks(pid) { return S().tasks.filter((t) => t.projectId === pid); },
  progress(p) {
    if (p.progressMode === 'manual') return clamp(Number(p.progress) || 0, 0, 100) / 100;
    const ms = p.milestones || [], ts = Proj.tasks(p.id).filter((t) => !Tasks.isRec(t));
    const units = ms.length + ts.length;
    if (!units) return p.status === 'done' ? 1 : 0;
    const done = ms.filter((m) => m.status === 'done').length + ms.filter((m) => m.status === 'doing').length * 0.5 + ts.filter((t) => t.status === 'done').length + ts.filter((t) => t.status === 'doing').length * 0.5;
    return done / units;
  },
  nextDeadlines(days = 30) {
    const today = D.today(), lim = D.add(today, days), out = [];
    for (const p of S().projects) {
      if (p.status === 'done') continue;
      if (p.deadline && p.deadline >= today && p.deadline <= lim) out.push({ kind: 'project', p, date: p.deadline, title: 'Deadline proyek' });
      for (const m of p.milestones || []) if (m.status !== 'done' && m.date && m.date <= lim) out.push({ kind: 'ms', p, m, date: m.date, title: m.title, late: m.date < today });
    }
    for (const t of S().tasks) if (t.projectId && t.status !== 'done' && t.deadline && t.deadline <= lim && !Tasks.isRec(t)) out.push({ kind: 'task', p: byId(S().projects, t.projectId), t, date: t.deadline, title: t.title, late: t.deadline < today });
    return out.sort((a, b) => (a.date < b.date ? -1 : 1));
  },
};
const UIAcad = { view: 'list', pid: '' };
Actions.acadView = (el) => { UIAcad.view = el.dataset.v; App.render(); };
Actions.openProject = (el) => { UIAcad.pid = el.dataset.id; UIAcad.view = 'detail'; App.render(); window.scrollTo({ top: 0 }); };

    </div>`,

Actions.cycleMilestone = (el) => Store.update((s) => { const m = (byId(s.projects, el.dataset.pid)?.milestones || []).find((x) => x.id === el.dataset.id); if (m) m.status = { todo: 'doing', doing: 'done', done: 'todo' }[m.status || 'todo']; });
Actions.moveMilestone = (el) => Store.update((s) => {

function bindKanban(root) {

/** Gantt sederhana: baris per milestone (atau per proyek bila tanpa milestone bertanggal) */
function gantt(projects) {
  const rows = [];
  for (const p of projects) {
    const ms = (p.milestones || []).filter((m) => m.date || m.start);
    if (projects.length > 1) rows.push({ head: true, p, start: p.start, end: p.deadline || p.start });
    if (ms.length) ms.forEach((m) => rows.push({ p, m, start: m.start || m.date, end: m.date || m.start }));
    else if (projects.length === 1) rows.push({ p, start: p.start, end: p.deadline || p.start, whole: true });
  }
  const dated = rows.filter((r) => r.start && r.end);
  if (!dated.length) return empty('flag', 'Belum ada tanggal', 'Isi tanggal mulai/selesai milestone agar timeline tampil.');
  const today = D.today();
  let min = dated.reduce((a, r) => (r.start < a ? r.start : a), dated[0].start), max = dated.reduce((a, r) => (r.end > a ? r.end : a), dated[0].end);
  if (today < min) min = today; if (today > max) max = today;
  min = D.monthStart(D.month(min)); max = D.monthEnd(D.month(max));
  const span = D.diff(min, max) + 1;
  const x = (d) => (D.diff(min, d) / span) * 100;
  const months = []; for (let m = D.month(min); m <= D.month(max); m = D.prevMonth(m) === m ? m : D.addMonths(m + '-01', 1).slice(0, 7)) months.push(m);
  const marks = months.map((m) => `<div class="gmonth" style="left:${x(m + '-01')}%">${D.fmt(m + '-01', { month: 'short' })}${m.endsWith('-01') ? ' ' + m.slice(2, 4) : ''}</div>`).join('');
  return `<div class="tbl-wrap" style="border:0"><div class="gantt">
    <div class="gh" style="padding-left:10px">Tahapan</div><div class="gh" style="position:relative">${marks}</div>
    ${rows.map((r) => {
      const late = r.m && r.m.status !== 'done' && r.end < today;
      const cls = r.m ? (r.m.status === 'done' ? 'done' : late ? 'late' : r.m.status === 'doing' ? 'doing' : '') : 'done';
      const bar = r.start && r.end ? `<button class="gbar ${cls}" style="left:${x(r.start)}%;width:calc(${((D.diff(r.start, r.end) + 1) / span) * 100}% );${r.head ? 'opacity:.35;height:8px;top:12px' : ''}" ${r.m ? `data-act="editMilestone" data-pid="${r.p.id}" data-id="${r.m.id}"` : `data-act="openProject" data-id="${r.p.id}"`} title="${esc((r.m ? r.m.title : r.p.name) + ': ' + D.fmt(r.start) + ' – ' + D.fmt(r.end))}" aria-label="${esc(r.m ? r.m.title : r.p.name)}"></button>` : '';
      return `<div class="gname" ${r.head ? 'style="font-weight:700;background:var(--surface-2)"' : ''}>${r.m ? `<span class="swatch" style="background:${r.m.status === 'done' ? 'var(--accent)' : late ? 'var(--bad)' : r.m.status === 'doing' ? 'var(--warn)' : 'var(--sage)'}"></span>` : ''}${esc(r.m ? r.m.title : r.p.name)}</div><div class="gtrack" ${r.head ? 'style="background:var(--surface-2)"' : ''}><div class="gtoday" style="left:${x(today)}%"></div>${bar}</div>`;
    }).join('')}
  </div></div>
  <div class="row small muted" style="margin-top:10px;gap:14px"><span><span class="swatch" style="background:var(--accent)"></span> Selesai</span><span><span class="swatch" style="background:var(--warn)"></span> Berjalan</span><span><span class="swatch" style="background:var(--sage)"></span> Belum</span><span><span class="swatch" style="background:var(--bad)"></span> Terlambat</span><span>│ garis merah = hari ini</span></div>`;
}

      ${routines.length ? `<div class="list">${routines.map((t) => { const nx = occurrences(t.date, t.rec, today, D.add(today, 60)).find((d) => !Tasks.doneOn(t, d)); return `<div class="li"><div class="main-col"><div class="t">${esc(t.title)}</div><div class="s"><span>${recLabel(t.rec)}</span>${t.time ? `<span>${t.time}</span>` : ''}<span>${esc(Cat.name('task', t.categoryId))}</span></div></div><span class="small muted">${nx ? 'berikutnya ' + D.rel(nx) : 'selesai'}</span><button class="btn icon ghost" data-act="editTask" data-id="${t.id}" aria-label="Ubah">${icon('edit', 'ico-sm')}</button></div>`; }).join('')}</div>` : empty('repeat', 'Belum ada rutinitas', 'Contoh: minum vitamin, olahraga, cek saldo mingguan.')}
      <p class="xs faint" style="margin-top:10px">Pengingat tampil saat aplikasi dibuka. Notifikasi saat aplikasi tertutup membutuhkan server/push yang belum ada di versi ini.</p>

/* =========================================================
   CALENDAR — kegiatan + tugas + deadline + milestone + tagihan
   Kegiatan berulang disimpan sekali dengan pola; kejadiannya dihitung saat tampil
   ========================================================= */
const ESTATUS = { scheduled: 'Terjadwal', done: 'Selesai', cancelled: 'Dibatalkan' };
const REMINDERS = [['', 'Tanpa pengingat'], ['10', '10 menit sebelum'], ['30', '30 menit sebelum'], ['60', '1 jam sebelum'], ['1440', '1 hari sebelum']];
const UICal = { view: 'month', cursor: null, q: '', cat: '', show: { event: true, task: true, deadline: true, ms: true, bill: true } };
const HOUR0 = 6, HOUR1 = 22, SLOT = 44;

const Cal = {
  /** semua item kalender dalam rentang; satu sumber data, tidak ada salinan */
  items(from, to) {
    const out = [], sh = UICal.show, q = UICal.q.toLowerCase();
    if (sh.event) for (const e of S().events) for (const d of occurrences(e.date, e.rec, from, to))
      out.push({ kind: 'event', date: d, s: e.allDay ? null : D.toMin(e.start), e: e.allDay ? null : D.toMin(e.end) ?? (D.toMin(e.start) + 60), title: e.title, color: Cat.color('event', e.categoryId), cat: e.categoryId, ref: e, sub: e.location, cancelled: e.status === 'cancelled' });
    if (sh.task || sh.deadline) for (const t of S().tasks) {
      if (sh.task) {
        const dates = Tasks.isRec(t) ? occurrences(t.date, t.rec, from, to) : t.date && t.date >= from && t.date <= to ? [t.date] : [];
        for (const d of dates) out.push({ kind: 'task', date: d, s: t.time ? D.toMin(t.time) : null, e: t.time ? D.toMin(t.time) + (t.duration || 30) : null, title: t.title, done: Tasks.doneOn(t, d), ref: t, color: Cat.color('task', t.categoryId) });
      }
      if (sh.deadline && t.deadline && t.deadline !== t.date && t.deadline >= from && t.deadline <= to && !Tasks.isRec(t))
        out.push({ kind: 'deadline', date: t.deadline, s: null, title: 'Deadline: ' + t.title, done: t.status === 'done', ref: t, color: 'var(--bad)' });
    }
    if (sh.ms) for (const p of S().projects) {
      for (const m of p.milestones || []) if (m.date && m.date >= from && m.date <= to) out.push({ kind: 'ms', date: m.date, s: null, title: m.title, sub: p.name, done: m.status === 'done', ref: m, p, color: 'var(--info)' });
      if (p.deadline && p.deadline >= from && p.deadline <= to && p.status !== 'done') out.push({ kind: 'deadline', date: p.deadline, s: null, title: 'Deadline proyek: ' + p.name, ref: p, isProject: true, color: 'var(--bad)' });
    }
    if (sh.bill) for (const o of Fin.plannedOcc(from, to, { includePaid: true })) if (o.p.kind === 'bill' || o.p.type === 'income')
      out.push({ kind: 'bill', date: o.date, s: null, title: (o.p.type === 'income' ? '↘ ' : '') + o.p.title + ' · ' + rpShort(o.p.amount), done: o.status === 'paid' || o.status === 'skip', ref: o.p, occ: o.date, color: 'var(--warn)' });
    return out.filter((i) => (!UICal.cat || (i.kind === 'event' && i.cat === UICal.cat)) && (!q || (i.title + ' ' + (i.sub || '') + ' ' + (i.ref.desc || '') + ' ' + (i.ref.location || '')).toLowerCase().includes(q)))
      .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : (a.s ?? -1) - (b.s ?? -1)));
  },
  next(n = 3) {
    const today = D.today(), now = D.nowMinutes();
    const list = [];
    for (const e of S().events) {
      if (e.status === 'cancelled') continue;
      for (const d of occurrences(e.date, e.rec, today, D.add(today, 60))) {
        if (d === today && !e.allDay && (D.toMin(e.end) ?? D.toMin(e.start) + 60) < now) continue;
        list.push({ e, date: d });
        if (list.length > 60) break;
      }
    }
    return list.sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : (a.e.start || '') < (b.e.start || '') ? -1 : 1)).slice(0, n);
  },
};

function readEvent(d, form) {

  }
  const rec = readRecurrence(d);
  if (rec.freq === 'days' && !(rec.days || []).length) return fieldError(form, 'rfreq', 'Pilih minimal satu hari.');
  if (rec.until && rec.until < d.date) return fieldError(form, 'runtil', 'Tanggal akhir pengulangan sebelum tanggal mulai.');
  if (d.url && !/^https?:\/\//i.test(d.url)) return fieldError(form, 'url', 'Tautan harus diawali http:// atau https://');
  return { title: d.title, date: d.date, allDay: !!d.allDay, start: d.allDay ? '' : d.start, end: d.allDay ? '' : d.end || D.fromMin(Math.min(D.toMin(d.start) + 60, 1439)), location: d.location, categoryId: d.categoryId, reminder: d.reminder, status: d.status, url: d.url, rec, desc: d.desc };

/** grid jam untuk tampilan minggu/hari, dengan penempatan kegiatan yang bertumpuk */
function timeGrid(days, items) {
  const today = D.today();
  const cols = days.length;
  const tmpl = `grid-template-columns:52px repeat(${cols},minmax(0,1fr))`;
  const hours = []; for (let h = HOUR0; h < HOUR1; h++) hours.push(h);
  const allday = (d) => items.filter((i) => i.date === d && (i.s == null));
  const timed = (d) => {
    const list = items.filter((i) => i.date === d && i.s != null).map((i) => ({ ...i, s2: clamp(i.s, HOUR0 * 60, HOUR1 * 60 - 15), e2: clamp(Math.max(i.e ?? i.s + 30, i.s + 20), HOUR0 * 60 + 15, HOUR1 * 60) }));
    // penempatan lajur sederhana untuk kegiatan yang tumpang tindih
    const lanes = []; list.forEach((i) => { let l = lanes.findIndex((end) => end <= i.s2); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = i.e2; i.lane = l; });
    list.forEach((i) => { i.n = Math.max(1, ...list.filter((j) => j.s2 < i.e2 && j.e2 > i.s2).map((j) => j.lane + 1)); });
    return list;
  };
  const nowM = D.nowMinutes();
  return `<div class="wk-wrap"><div class="wk" style="${tmpl}">

      ${d === today && nowM >= HOUR0 * 60 && nowM <= HOUR1 * 60 ? `<div class="nowline" style="top:${((nowM - HOUR0 * 60) / 60) * SLOT}px"></div>` : ''}
      ${timed(d).map((i) => { const top = ((i.s2 - HOUR0 * 60) / 60) * SLOT, h = Math.max(18, ((i.e2 - i.s2) / 60) * SLOT - 2); const w = 100 / i.n; const bg = i.kind === 'event' ? `color-mix(in srgb,${i.color} 26%,var(--surface))` : 'var(--surface-2)';

    </div>`).join('')}

/* ---------- pengingat (hanya saat aplikasi terbuka) ---------- */
const Reminders = {
  fired: new Set(),
  tick() {
    const today = D.today(), now = D.nowMinutes();
    for (const e of S().events) {
      if (!e.reminder || e.allDay || e.status === 'cancelled') continue;
      const r = Number(e.reminder);
      for (const d of [today, D.add(today, 1)]) {
        if (!occursOn(e.date, e.rec, d)) continue;
        const startAbs = D.diff(today, d) * 1440 + D.toMin(e.start);
        const key = e.id + d;
        if (startAbs - r <= now && startAbs >= now && !Reminders.fired.has(key)) {
          Reminders.fired.add(key);
          const msg = `${e.title} · ${d === today ? 'hari ini' : 'besok'} ${e.start}${e.location ? ' · ' + e.location : ''}`;
          toast('Pengingat: ' + msg, { ms: 9000 });
          try { if (window.Notification && Notification.permission === 'granted') new Notification('Pengingat kegiatan', { body: msg }); } catch { }
        }
      }
    }
  },
  start() { Reminders.tick(); setInterval(Reminders.tick, 30000); },
};

function txRowsForExport(list) {
  return list.map((t) => ({
    Tanggal: t.date, Jenis: TX_TYPES[t.type] + (t.adjust ? ' (penyesuaian)' : ''), Nominal: t.amount,
    Kategori: t.type === 'transfer' ? '' : Cat.name(t.type === 'income' ? 'income' : 'expense', t.categoryId),
    Akun: Fin.accName(t.accountId), 'Akun tujuan': t.type === 'transfer' ? Fin.accName(t.toAccountId) : '', Deskripsi: t.desc || '', Catatan: t.note || '', DEMO: t.demo ? 'DEMO' : '',
  }));
}
function toCSV(rows) {
  if (!rows.length) return '';
  const cols = Object.keys(rows[0]);
  const q = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '\uFEFF' + [cols.join(';'), ...rows.map((r) => cols.map((c) => q(r[c])).join(';'))].join('\r\n');
}
Actions.exportTx = (el) => {
  const list = el.dataset.all ? S().transactions.slice().sort(txSort('date-asc')) : filteredTx().slice().reverse();

  const rows = txRowsForExport(list);

    if (!window.XLSX) return toast('Pustaka Excel belum termuat (butuh internet saat pertama dibuka). Gunakan CSV.', { type: 'bad' });
    const wb = XLSX.utils.book_new(); const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 11 }, { wch: 13 }, { wch: 12 }, { wch: 22 }, { wch: 16 }, { wch: 16 }, { wch: 34 }, { wch: 24 }, { wch: 6 }];

};

Actions.exportICS = () => {
  const evs = S().events; if (!evs.length) return toast('Belum ada kegiatan.');
  const dt = (d, t) => d.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : '');
  const escI = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const fold = (l) => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); };
  const RR = { daily: 'DAILY', weekly: 'WEEKLY', monthly: 'MONTHLY', days: 'WEEKLY' };
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dasbor Pribadi//ID', 'CALSCALE:GREGORIAN', 'X-WR-TIMEZONE:Asia/Jakarta'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  for (const e of evs) {
    lines.push('BEGIN:VEVENT', 'UID:' + (e.icsUid || e.id + '@dasbor-pribadi'), 'DTSTAMP:' + stamp, fold('SUMMARY:' + escI(e.title)));
    if (e.allDay) lines.push('DTSTART;VALUE=DATE:' + dt(e.date), 'DTEND;VALUE=DATE:' + dt(D.add(e.date, 1)));
    else lines.push('DTSTART;TZID=Asia/Jakarta:' + dt(e.date, e.start), 'DTEND;TZID=Asia/Jakarta:' + dt(e.date, e.end || e.start));
    if (e.location) lines.push(fold('LOCATION:' + escI(e.location)));
    if (e.desc) lines.push(fold('DESCRIPTION:' + escI(e.desc)));
    if (e.rec && e.rec.freq !== 'none') {
      let r = 'RRULE:FREQ=' + RR[e.rec.freq]; if (e.rec.freq === 'days') r += ';BYDAY=' + e.rec.days.map((d) => BY[d]).join(',');
      if (e.rec.until) r += ';UNTIL=' + dt(e.rec.until) + 'T235959';
      lines.push(r);
      if ((e.rec.exceptions || []).length) lines.push('EXDATE;TZID=Asia/Jakarta:' + e.rec.exceptions.map((x) => dt(x, e.start || '00:00')).join(','));
    }
    if (e.status === 'cancelled') lines.push('STATUS:CANCELLED');
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const inViewer = window.claude && window.claude.use;
  saveFile(inViewer ? `kalender-${D.today()}.ics.txt` : `kalender-${D.today()}.ics`, lines.join('\r\n'), 'text/calendar');
  if (inViewer) toast('Di tampilan claude.ai berkas disimpan sebagai .ics.txt — ganti nama menjadi .ics sebelum diimpor ke Google Calendar.', { ms: 8000 });
};

/* ---------- sinkronisasi opsional (hanya saat dibuka sebagai artifact di claude.ai) ---------- */
const DEVICE = (() => { try { let d = localStorage.getItem('pld.device'); if (!d) { d = uid('dev'); localStorage.setItem('pld.device', d); } return d; } catch { return uid('dev'); } })();
const Sync = {
  status: 'off', note: '', db: null, base: '', timer: null, unsub: null, busy: false, lastPushed: 0,
  available() { return !!(window.claude && typeof window.claude.use === 'function'); },
  mode() { return Sync.available() ? 'claude' : 'firebase'; },
  async init() {
    window.addEventListener('online', () => { if (Sync.status === 'on' || Sync.status === 'error') { if (Sync.db) { Sync.status = 'on'; Sync.push(); } } });
    if (Sync.available()) { if (S().settings.sync) await Sync.connect(); return; }
    await FB.init();
  },
  async connect() {
    Sync.status = 'connecting'; App.renderChrome();
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { Sync.status = 'unavailable'; Sync.note = 'Penyimpanan claude.ai tidak tersedia di tampilan ini (mis. tidak masuk akun).'; App.renderChrome(); return false; }
      return await Sync.connectWith(db, 'data/users/' + id, 120000);
    } catch (e) { Sync.status = 'error'; Sync.note = (e && (e.code || e.message)) || 'gagal'; App.renderChrome(); return false; }
  },
  /** dipakai claude.ai dan Firebase (API dokumen keduanya serupa: doc().get/set/delete/onSnapshot) */
  async connectWith(db, base, chunk) {
    Sync.status = 'connecting'; App.renderChrome();
    try {
      Sync.db = db; Sync.base = base; Sync.chunk = chunk;
      const meta = await db.doc(base + '/pldmeta').get();
      const remote = meta.exists ? meta.data() : null;
      let firstTime = false; try { firstTime = localStorage.getItem('pld.synced') !== base; } catch { }
      // perangkat yang baru pertama kali disambungkan selalu MENGAMBIL data yang sudah ada di cloud (tidak menimpanya)
      if (remote && (firstTime || (remote.v > (S().meta.updatedAt || 0) && remote.device !== DEVICE))) await Sync.pull(remote);
      else if (!remote || remote.v < (S().meta.updatedAt || 0)) await Sync.push();
      try { localStorage.setItem('pld.synced', base); } catch { }
      Sync.unsub && Sync.unsub();
      Sync.unsub = db.doc(base + '/pldmeta').onSnapshot((snap) => {
        const r = snap.exists ? snap.data() : null;
        if (r && r.device !== DEVICE && r.v > (S().meta.updatedAt || 0) && !Sync.busy) Sync.pull(r);
      }, () => { Sync.status = 'error'; Sync.note = 'Koneksi sinkron terputus. Muat ulang halaman.'; App.renderChrome(); });
      Sync.status = 'on'; Sync.note = ''; App.render();
      return true;
    } catch (e) {
      Sync.status = 'error';
      Sync.note = e && /permission/i.test(e.code || e.message || '') ? 'Akses ditolak — periksa Rules Firestore (lihat panduan).' : (e && (e.code || e.message)) || 'gagal';
      App.renderChrome(); return false;
    }
  },
  stop() { Sync.unsub && Sync.unsub(); Sync.unsub = null; Sync.db = null; clearTimeout(Sync.timer); },
  schedule() { if (Sync.status !== 'on') return; clearTimeout(Sync.timer); Sync.timer = setTimeout(Sync.push, 2500); },
  async push() {
    if (!Sync.db || Sync.busy) { if (Sync.busy) Sync.schedule(); return; }
    Sync.busy = true;
    try {
      const st = S(); const v = st.meta.updatedAt || Date.now();
      const json = JSON.stringify(st); const CH = Sync.chunk || 120000; const n = Math.max(1, Math.ceil(json.length / CH));
      const col = Sync.db.collection(Sync.base);
      for (let i = 0; i < n; i++) await col.doc('pldchunk' + i).set({ v, i, part: json.slice(i * CH, (i + 1) * CH) });
      const old = await col.doc('pldmeta').get();
      await col.doc('pldmeta').set({ v, n, device: DEVICE, size: json.length, at: Date.now() });
      if (old.exists && old.data().n > n) for (let i = n; i < old.data().n; i++) await col.doc('pldchunk' + i).delete();
      Sync.lastPushed = Date.now(); Sync.status = 'on'; Sync.note = '';
    } catch (e) { Sync.status = 'error'; Sync.note = e && e.code === 'quota_exceeded' ? 'Kuota penyimpanan penuh.' : navigator.onLine === false ? 'Sedang offline — perubahan dikirim saat online lagi.' : 'Gagal mengirim perubahan; data tetap aman di perangkat ini.'; }
    Sync.busy = false; App.renderChrome();
  },
  async pull(meta, tries = 0) {
    Sync.busy = true;
    try {
      const col = Sync.db.collection(Sync.base); const parts = [];
      for (let i = 0; i < meta.n; i++) { const d = await col.doc('pldchunk' + i).get(); if (!d.exists || d.data().v !== meta.v) throw new Error('partial'); parts.push(d.data().part); }
      const st = migrate(JSON.parse(parts.join('')));
      try { localStorage.setItem('pld.backup.beforeSync', JSON.stringify(S())); } catch { }
      st.settings.sync = true;
      Store.replace(st);
      toast('Data diperbarui dari perangkat lain');
    } catch (e) {
      if (e.message === 'partial' && tries < 3) { Sync.busy = false; return setTimeout(() => Sync.pull(meta, tries + 1), 3000); }
      Sync.status = 'error'; Sync.note = 'Gagal mengambil data dari cloud.';
    }
    Sync.busy = false; App.renderChrome();
  },
};

/* ---------- Firebase (versi GitHub Pages / lokal): login Google + Firestore ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('gagal memuat ' + src)); document.head.appendChild(s); }); }
const FB = {
  ver: '10.12.2', auth: null, user: null,
  config() {
    if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey) return window.FIREBASE_CONFIG;
    try { return JSON.parse(localStorage.getItem('pld.fbconfig') || 'null'); } catch { return null; }
  },
  async init() {
    const cfg = FB.config();
    if (!cfg) { Sync.status = 'off'; Sync.note = ''; return; }
    if (!/^https?:$/.test(location.protocol)) { Sync.status = 'unavailable'; Sync.note = 'Login Google butuh alamat web (GitHub Pages), bukan file yang diklik dua kali.'; App.renderChrome(); return; }
    try {
      if (!window.firebase || !window.firebase.firestore) for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB.ver}/firebase-${m}-compat.js`);
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      FB.auth = firebase.auth();
      try { await FB.auth.getRedirectResult(); } catch (e) { if (e && e.code) toast('Gagal masuk: ' + e.code, { type: 'bad' }); }
      FB.auth.onAuthStateChanged((u) => {
        FB.user = u;
        if (u) Sync.connectWith(firebase.firestore(), 'pld/' + u.uid + '/data', 400000);
        else { Sync.stop(); Sync.status = 'off'; Sync.note = ''; App.render(); }
      });
    } catch (e) { Sync.status = 'error'; Sync.note = 'Firebase gagal dimuat (perlu internet).'; App.renderChrome(); }
  },
  async signIn() {
    if (!FB.auth) { await FB.init(); if (!FB.auth) return toast(Sync.note || 'Firebase belum siap.', { type: 'bad' }); }
    const p = new firebase.auth.GoogleAuthProvider();
    try { await FB.auth.signInWithPopup(p); }
    catch (e) {
      if (/popup|operation-not-supported|web-storage/i.test((e && e.code) || '')) return FB.auth.signInWithRedirect(p);
      if (e && e.code === 'auth/unauthorized-domain') return toast('Domain ini belum diizinkan. Tambahkan ' + location.hostname + ' di Firebase → Authentication → Settings → Authorized domains.', { type: 'bad', ms: 12000 });
      toast('Gagal masuk: ' + ((e && (e.code || e.message)) || ''), { type: 'bad' });
    }
  },
};

  let cfg; try { cfg = JSON.parse(txt); } catch { return toast('Format konfigurasi tidak terbaca. Tempel seluruh blok firebaseConfig = { ... }.', { type: 'bad' }); }
  if (!cfg.apiKey || !cfg.projectId) return toast('Konfigurasi harus berisi apiKey dan projectId.', { type: 'bad' });

Actions.setLogo = async () => {
  const f = await pickFile('image/*'); if (!f) return;
  if (!/^image\//.test(f.type)) return toast('Pilih berkas gambar.', { type: 'bad' });
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
  const img = new Image();
  img.onload = () => {
    // perkecil ke 160px agar hemat penyimpanan browser
    const c = document.createElement('canvas'); const n = 160; c.width = c.height = n;
    const g = c.getContext('2d'); const sc = Math.max(n / img.width, n / img.height);
    const w = img.width * sc, h = img.height * sc; g.drawImage(img, (n - w) / 2, (n - h) / 2, w, h);
    let data; try { data = c.toDataURL('image/png'); } catch { data = url; }
    Store.update((s) => (s.settings.logo = data)); toast('Logo diganti');
  };
  img.onerror = () => toast('Gambar tidak bisa dibaca.', { type: 'bad' });
  img.src = url;
};

/* =========================================================
   APP — navigasi, router (#hash), rendering, delegasi aksi
   ========================================================= */
const PAGES = {
  beranda: { title: 'Beranda', icon: 'home', render: renderDashboard },
  keuangan: { title: 'Keuangan', icon: 'wallet', render: renderFinance },
  planner: { title: 'Planner', icon: 'list', render: renderPlanner },
  kalender: { title: 'Kalender', icon: 'cal', render: renderCalendar },
  akademik: { title: 'Akademik & Proyek', icon: 'book', render: renderAcademic, short: 'Akademik' },
  rumah: { title: 'Rumah & Pribadi', icon: 'house', render: renderHome, short: 'Rumah' },
  data: { title: 'Data & Pengaturan', icon: 'gear', render: renderSettings, short: 'Data' },
};
const App = {
  page: 'beranda',
  go(p) { if (!PAGES[p]) p = 'beranda'; if (location.hash !== '#' + p) location.hash = p; else App.route(); },
  route() {
    const h = (location.hash || '').replace('#', '');
    App.page = PAGES[h] ? h : 'beranda';
    App.render(); window.scrollTo({ top: 0 });
  },
  applyTheme() {
    const t = S().settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else if (App._ownTheme) document.documentElement.removeAttribute('data-theme');
    App._ownTheme = t !== 'auto';
    if (document.getElementById('view')) App.render();
  },
  renderChrome() {
    const s = S(); const today = D.today();
    const badge = { planner: Tasks.on(today).filter((i) => !i.done).length + Tasks.overdue().length, kalender: S().events.filter((e) => occursOn(e.date, e.rec, today) && e.status !== 'cancelled').length };
    const nav = (keys) => keys.map((k) => `<a href="#${k}" ${App.page === k ? 'aria-current="page"' : ''}>${icon(PAGES[k].icon)}<span>${PAGES[k].short || PAGES[k].title}</span>${badge[k] ? `<span class="count">${badge[k]}</span>` : ''}</a>`).join('');
    const storeDot = !Store.storageOk ? 'bad' : Sync.status === 'on' ? 'ok' : Sync.status === 'error' ? 'warn' : 'ok';
    const storeTxt = !Store.storageOk ? 'Tidak tersimpan' : Sync.status === 'on' ? (Sync.busy || Sync.timer && Sync._pending ? 'Menyinkronkan…' : 'Tersimpan & tersinkron') : Sync.status === 'error' ? 'Sinkron bermasalah' : 'Tersimpan di perangkat ini';
    $('#sidebar').innerHTML = `
      <div class="brand"><div class="brand-mark">${s.settings.logo ? `<img src="${esc(s.settings.logo)}" alt="Logo" style="width:100%;height:100%;object-fit:cover">` : typeof LOGO_SVG !== 'undefined' ? LOGO_SVG.replace('id="g"', 'id="lg"').replace(/url\(#g\)/g, 'url(#lg)') : 'D'}</div><div><b>Dasbor Pribadi</b><small>${esc(s.settings.name || 'keuangan · jadwal · TA')}</small></div></div>
      <nav class="nav" aria-label="Navigasi utama">${nav(['beranda', 'keuangan', 'planner', 'kalender', 'akademik', 'rumah'])}<div class="nav-label">Sistem</div>${nav(['data'])}</nav>
      <div class="sidebar-foot">
        <button class="btn primary block" data-act="quickSheet">${icon('plus', 'ico-sm')} Tambah cepat</button>
        <div class="row between"><span class="storage-note"><span class="dot ${storeDot}"></span>${storeTxt}</span><button class="btn icon ghost" data-act="cycleTheme" aria-label="Ganti tema" title="Ganti tema">${icon(document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches) ? 'sun' : 'moon', 'ico-sm')}</button></div>
      </div>`;
    $('#tabbar').innerHTML = ['beranda', 'keuangan', 'planner', 'kalender'].map((k) => `<a href="#${k}" ${App.page === k ? 'aria-current="page"' : ''}>${icon(PAGES[k].icon)}<span>${PAGES[k].short || PAGES[k].title}</span></a>`).join('') +
      `<button data-act="moreSheet" ${['akademik', 'rumah', 'data'].includes(App.page) ? 'aria-current="page"' : ''}>${icon('more')}<span>Lainnya</span></button>`;
    const sn = $('#storeNote'); if (sn) sn.innerHTML = `<span class="dot ${storeDot}"></span>${storeTxt}`;
  },
  render() {
    const v = $('#view'); if (!v) return;
    App.renderChrome();
    const pg = PAGES[App.page];
    document.title = pg.title === 'Beranda' ? 'Dasbor Pribadi' : pg.title + ' · Dasbor Pribadi';
    const today = D.today();
    $('#topbar').innerHTML = `<div><div class="eyebrow">${D.fmt(today, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div><h1>${pg.title}</h1></div>
      <div class="topbar-actions"><span class="storage-note" id="storeNote"></span>${App.page === 'keuangan' ? `<button class="btn primary" data-act="addTx">${icon('plus', 'ico-sm')} Catat transaksi</button>` : ''}</div>`;
    if (App.page === 'beranda') $('#topbar').hidden = true; else $('#topbar').hidden = false;
    App.renderChrome();
    Object.values(Charts.inst).forEach((c) => { try { c.destroy(); } catch { } }); Charts.inst = {};
    try { pg.render(v); }
    catch (e) { console.error(e); v.innerHTML = `<div class="banner bad">${icon('alert', 'ico-sm')}<span>Halaman gagal ditampilkan: ${esc(e.message)}. Data Anda tetap aman — coba muat ulang, atau ekspor backup dari menu Data.</span></div>`; }
    if (Store.lastError && !App._warned) { App._warned = true; toast(Store.lastError, { type: 'bad', ms: 8000 }); }
  },
};
Actions.cycleTheme = () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  Store.update((s) => (s.settings.theme = cur === 'dark' ? 'light' : 'dark'), { silent: true });
  App.applyTheme();
};
Actions.quickSheet = () => {
  Modal.open({
    title: 'Tambah cepat', noFooter: true,
    body: `<div class="list">${[['addTx', 'expense', 'arrowout', 'Pengeluaran'], ['addTx', 'income', 'arrowin', 'Pemasukan'], ['addTx', 'transfer', 'swap', 'Transfer antarakun'], ['addTask', '', 'check', 'Tugas'], ['addEvent', '', 'cal', 'Kegiatan kalender'], ['editGoal', '', 'target', 'Target tabungan'], ['editPlannedBill', '', 'bell', 'Tagihan']].map(([a, t, ic, l]) => `<button class="btn ghost" style="justify-content:flex-start;padding:12px 8px" data-qa="${a}" data-type="${t}">${icon(ic)} ${l}</button>`).join('')}</div>`,
    onOpen: (form, close) => $$('[data-qa]', form).forEach((b) => (b.onclick = () => { close(); const el = { dataset: { type: b.dataset.type || undefined, date: D.today() } }; if (!b.dataset.type) delete el.dataset.type; Actions[b.dataset.qa](el); })),
  });
};
Actions.moreSheet = () => {
  const back = document.createElement('div'); back.className = 'modal-back'; back.style.background = 'rgba(18,24,19,.35)';
  back.innerHTML = `<div class="sheet" role="dialog" aria-label="Menu lainnya"><div class="grip"></div>${['akademik', 'rumah', 'data'].map((k) => `<a href="#${k}">${icon(PAGES[k].icon)} ${PAGES[k].title}</a>`).join('')}<button class="it" data-close>${icon('x')} Tutup</button></div>`;
  back.onclick = (e) => { if (e.target === back || e.target.closest('a,[data-close]')) back.remove(); };
  document.body.appendChild(back);
};

/* ---------- delegasi klik global: [data-act] dan [data-goto] ---------- */
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-goto]');
  if (g) { if (g.dataset.tab) UIFin.tab = g.dataset.tab; App.go(g.dataset.goto); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = Actions[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  e.stopPropagation();
  try { fn(el, e); } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + err.message, { type: 'bad' }); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.target.matches('input,textarea,select') || Modal.stack.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n') { e.preventDefault(); Actions.addTx({ dataset: { type: 'expense' } }); }
  if (e.key === 't') { e.preventDefault(); Actions.addTask(); }
  if (e.key === 'k') { e.preventDefault(); Actions.addEvent({ dataset: { date: D.today() } }); }
});
window.addEventListener('hashchange', App.route);
window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) { Store.load(); App.render(); toast('Data diperbarui dari tab lain'); } });

/* ---------- start ---------- */
function boot() {
  Store.load();
  App.applyTheme();
  Store.on(() => App.render());
  App.route();
  Reminders.start();
  Sync.init();
  // pergantian hari (lewat tengah malam WIB) → perbarui tampilan
  let lastDay = D.today();
  setInterval(() => { const d = D.today(); if (d !== lastDay) { lastDay = d; App.render(); } }, 60000);
  // PWA: service worker hanya saat disajikan lewat http(s) sebagai halaman sendiri
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.top === window.self && !(window.claude && window.claude.use) && document.querySelector('link[rel=manifest]')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
