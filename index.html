<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="firebase-config.js"></script>
<title>Dasbor Pribadi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: sidebar kiri (desktop) + kolom kerja lapang; di HP jadi tab bar bawah + tombol tambah melayang.
   Palet: off-white & krem sebagai dasar, sage sebagai bidang lembut, hijau tua sebagai satu-satunya aksen. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F1F4F9; --surface-3:#E6ECF4;
  --line:#E7ECF3; --line-strong:#D3DBE6;
  --fg:#1B1F2A; --muted:#6B7280; --faint:#A0A8B5;
  --sage:#7CC4F5; --sage-soft:#EAF4FE; --sage-ink:#1D5FC2;
  --accent:#2A7DE9; --accent-hover:#1F6AD0; --accent-fg:#FFFFFF; --accent-soft:#EAF3FE;
  --good:#1F9D6B; --good-soft:#E3F6EE; --warn:#C27C0E; --warn-soft:#FDF2DE; --bad:#D9483B; --bad-soft:#FDE8E6; --info:#2A7DE9; --info-soft:#EAF3FE;
  --grad:linear-gradient(120deg,#3DA9F5 0%,#2A7DE9 100%); --gold:#C9A04A;
  --shadow:0 2px 6px rgba(27,47,84,.05),0 12px 32px -14px rgba(27,47,84,.16);
  --radius:18px; --radius-sm:11px;
  --f-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sidebar:236px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#161C27; --surface-2:#1C2431; --surface-3:#253042;
  --line:#232C3A; --line-strong:#334055;
  --fg:#E8EDF5; --muted:#9AA6B8; --faint:#6E7A8D;
  --sage:#4FA8E8; --sage-soft:#16263A; --sage-ink:#9CCBF5;
  --accent:#5AA2F5; --accent-hover:#79B4F7; --accent-fg:#0B1220; --accent-soft:#18283D;
  --good:#4CC895; --good-soft:#12302A; --warn:#E8B04E; --warn-soft:#382B15; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#5AA2F5; --info-soft:#18283D;
  --grad:linear-gradient(120deg,#2B8AE0 0%,#1C5FC4 100%); --gold:#D7B15C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#161C27; --surface-2:#1C2431; --surface-3:#253042;
  --line:#232C3A; --line-strong:#334055;
  --fg:#E8EDF5; --muted:#9AA6B8; --faint:#6E7A8D;
  --sage:#4FA8E8; --sage-soft:#16263A; --sage-ink:#9CCBF5;
  --accent:#5AA2F5; --accent-hover:#79B4F7; --accent-fg:#0B1220; --accent-soft:#18283D;
  --good:#4CC895; --good-soft:#12302A; --warn:#E8B04E; --warn-soft:#382B15; --bad:#F07A6E; --bad-soft:#3A1E1C; --info:#5AA2F5; --info-soft:#18283D;
  --grad:linear-gradient(120deg,#2B8AE0 0%,#1C5FC4 100%); --gold:#D7B15C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;line-height:1.2}
h1{font-size:1.65rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.92rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:650}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:var(--surface-3);color:var(--fg);border-radius:20px;padding:1px 7px;font-weight:600}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:10px 10px 4px;font-weight:600}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:15px;height:15px}

.main{min-width:0;padding-block:22px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.main-inner{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar .eyebrow{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.storage-note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.tabbar{display:none}
.fab{display:none}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:6px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{display:flex;align-items:center;gap:8px}
.card-h .sub{color:var(--muted);font-size:12.5px;font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .xs{font-size:11.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* stats */
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:1.45rem;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.lg{font-size:2rem}
.stat .hint{font-size:12px;color:var(--muted)}
.stats-band{display:grid;grid-template-columns:1.25fr repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.stats-band>div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.stats-band>div:first-child{border-left:0;background:var(--accent-soft)}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.accent{background:var(--accent-soft);color:var(--sage-ink)}
.pill.demo{background:var(--warn-soft);color:var(--warn);letter-spacing:.06em;font-size:10px;padding:1px 6px}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.prio-high{color:var(--bad)} .prio-med{color:var(--warn)} .prio-low{color:var(--muted)}

/* progress */
.bar{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .3s}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bar.thin{height:5px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13.5px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.field>.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .help{font-size:11.5px;color:var(--faint)}
.field .err{font-size:12px;color:var(--bad);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 10px;min-height:38px}
textarea.input{min-height:72px;resize:vertical}
.input:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.input.invalid{border-color:var(--bad)}
.money{position:relative}
.money .input{padding-left:36px;font-variant-numeric:tabular-nums;font-weight:600}
.money::before{content:"Rp";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);font-weight:600;pointer-events:none}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.typepick label{display:flex;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:9px;padding:8px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.typepick input{position:absolute;opacity:0;pointer-events:none}
.typepick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick label{border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-width:130px;min-height:34px;padding:6px 9px;font-size:13px}
.filters .search{flex:1 1 200px;min-width:160px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main-col{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li .acts{display:flex;gap:2px;opacity:.55;transition:opacity .15s}
.li:hover .acts,.li:focus-within .acts{opacity:1}
.li.done .t{text-decoration:line-through;color:var(--faint)}
.tick{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.tick svg{width:13px;height:13px;stroke:var(--accent-fg);stroke-width:2.6;fill:none;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1}
.ic-circle{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:26px 12px;color:var(--muted)}
.empty .ico{width:28px;height:28px;color:var(--faint)}
.empty b{color:var(--fg);font-weight:600}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.bad td{background:var(--bad-soft)} .tbl tr.dup td{background:var(--warn-soft)}
.tbl th button{all:unset;cursor:pointer}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);background:var(--info-soft);color:var(--fg);font-size:13px}
.banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.good{background:var(--good-soft)}
.banner .ico{margin-top:2px}
.onboard{background:var(--accent);color:var(--accent-fg);border-radius:var(--radius);padding:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.onboard h2{font-size:1.4rem}
.onboard p{opacity:.85;margin-top:6px}
.onboard .opts{display:flex;flex-direction:column;gap:8px}
.onboard .btn{justify-content:flex-start;background:color-mix(in srgb,var(--accent-fg) 12%,transparent);border-color:color-mix(in srgb,var(--accent-fg) 25%,transparent);color:var(--accent-fg)}
.onboard .btn:hover{background:color-mix(in srgb,var(--accent-fg) 20%,transparent)}
.onboard .btn.main{background:var(--accent-fg);color:var(--accent)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(18,24,19,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);border:1px solid var(--line)}
.modal.wide{width:min(920px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .left{margin-right:auto;display:flex;gap:8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal{animation:rise .18s}

/* toast */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:380px;animation:rise .2s}
.toast.bad{background:var(--bad);color:#fff}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;pointer-events:auto;padding:2px 4px}

/* charts */
.chart-box{position:relative;height:240px}
.chart-box.sm{height:190px}
.chart-box.lg{height:300px}
.chart-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;text-align:center;padding:10px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.legend .li{padding:5px 0;gap:8px}

/* budget rows */
.budget-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.budget-row:last-child{border-bottom:0}

/* accounts */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.acc{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.acc .bal{font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.acc.savings{background:var(--sage-soft);border-color:transparent}

/* projection ledger */
.ledger{display:flex;flex-direction:column;font-size:13.5px}
.ledger .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ledger .ln.total{border-bottom:0;border-top:1.5px solid var(--fg);margin-top:4px;padding-top:10px;font-weight:700;font-size:15px}
.ledger .ln .op{font-family:var(--f-mono);color:var(--faint);width:14px;display:inline-block}
.formula{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:8px 10px;border-radius:8px;line-height:1.6;overflow-x:auto}

/* calendar */
.cal-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-title{font-family:var(--f-display);font-size:1.2rem;font-weight:600;min-width:180px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line);gap:1px}

.month .day.out{background:var(--bg)}

.chipev.deadline{background:var(--bad-soft)}
.chipev.bill{background:var(--warn-soft)}
.chipev.ms{background:var(--info-soft)}

.agenda-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surface-2);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-4px}

.gantt .gbar.done{background:var(--accent)} .gantt .gbar.doing{background:var(--warn)} .gantt .gbar.late{background:var(--bad)}

<script>
'use strict';
/* =========================================================
   CORE — utilitas tanggal (WIB), Rupiah, store, UI helpers
   ========================================================= */
const TZ = 'Asia/Jakarta';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
const sum = (arr, f = (x) => x) => arr.reduce((a, b) => a + (Number(f(b)) || 0), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const byId = (arr, id) => (arr || []).find((x) => x.id === id);

/* ---------- tanggal: semua tanggal disimpan 'YYYY-MM-DD' (zona Asia/Jakarta) ---------- */
const D = {
  today() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  },
  nowTime() {
    return new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
  },
  nowMinutes() { const [h, m] = D.nowTime().split(':').map(Number); return h * 60 + m; },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  str(dt) { return dt.toISOString().slice(0, 10); },
  valid(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
    const dt = D.parse(s); return D.str(dt) === s;
  },
  add(s, n) { const dt = D.parse(s); dt.setUTCDate(dt.getUTCDate() + n); return D.str(dt); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 86400000); }, // b - a (hari)
  dow(s) { return D.parse(s).getUTCDay(); }, // 0=Minggu
  month(s) { return s.slice(0, 7); },
  monthStart(key) { return key + '-01'; },
  daysIn(key) { const [y, m] = key.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); },
  monthEnd(key) { return key + '-' + String(D.daysIn(key)).padStart(2, '0'); },
  addMonths(s, n) {
    const [y, m, d] = s.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    const key = D.str(t).slice(0, 7);
    return key + '-' + String(Math.min(d, D.daysIn(key))).padStart(2, '0');
  },
  prevMonth(key) { return D.addMonths(key + '-01', -1).slice(0, 7); },
  weekStart(s) { const w = D.dow(s); return D.add(s, -((w + 6) % 7)); }, // Senin
  fmt(s, opt = { day: 'numeric', month: 'short', year: 'numeric' }) {
    if (!s) return '—';
    return new Intl.DateTimeFormat('id-ID', { timeZone: 'UTC', ...opt }).format(D.parse(s));
  },
  long(s) { return D.fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); },
  short(s) { return D.fmt(s, { day: 'numeric', month: 'short' }); },
  wd(s) { return D.fmt(s, { weekday: 'short' }); },
  monthName(key) { return D.fmt(key + '-01', { month: 'long', year: 'numeric' }); },
  rel(s) {
    const n = D.diff(D.today(), s);
    if (n === 0) return 'hari ini'; if (n === 1) return 'besok'; if (n === -1) return 'kemarin';
    if (n > 1 && n < 7) return n + ' hari lagi'; if (n < -1 && n > -30) return Math.abs(n) + ' hari lalu';
    return D.short(s);
  },
  toMin(t) { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); },
  fromMin(n) { return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); },
  range(a, b) { const out = []; for (let s = a; s <= b; s = D.add(s, 1)) out.push(s); return out; },
};

/* ---------- Rupiah ---------- */
const rp = (n, { sign = false } = {}) => {
  const v = Math.round(Number(n) || 0);
  const s = Math.abs(v).toLocaleString('id-ID');
  return (v < 0 ? '−' : sign && v > 0 ? '+' : '') + 'Rp' + s;
};
const rpShort = (n) => {
  const v = Math.abs(n), s = n < 0 ? '−' : '';
  if (v >= 1e9) return s + 'Rp' + (v / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
  if (v >= 1e6) return s + 'Rp' + (v / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
  if (v >= 1e3) return s + 'Rp' + Math.round(v / 1e3).toLocaleString('id-ID') + ' rb';
  return rp(n);
};
/** "Rp 25.000" / "25000" / "25.000,50" → 25000 (bilangan bulat Rupiah) */
function parseAmount(v) {
  if (typeof v === 'number') return Math.round(v);
  let s = String(v ?? '').trim();
  if (!s) return NaN;
  const neg = /^-|^\(|−/.test(s);
  s = s.replace(/rp/i, '').replace(/\s/g, '');
  s = s.replace(/,\d{1,2}$/, ''); // buang desimal gaya Indonesia
  s = s.replace(/\.\d{1,2}$/, (m) => (/\.\d{3}/.test(s) ? m : '')); // 25000.5 → 25000
  s = s.replace(/[^\d]/g, '');
  if (!s) return NaN;
  return (neg ? -1 : 1) * parseInt(s, 10);
}

  check: '<path d="M4 12.5 9 17.5 20 6.5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',
  cal: '<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',

const SCHEMA_VERSION = 1;
const STORAGE_KEY = 'pld.data.v1';

    settings: { name: '', theme: 'auto', rolloverEnabled: false, rollover: {}, sync: false, onboarded: false, starterApplied: {} },

/** Melengkapi field yang hilang (data lama / impor) tanpa membuang data pengguna. */
function migrate(s) {
  const base = emptyState();
  if (!s || typeof s !== 'object') return base;
  const out = { ...base, ...s };
  out.meta = { ...base.meta, ...(s.meta || {}) };
  out.settings = { ...base.settings, ...(s.settings || {}) };
  out.categories = { ...base.categories, ...(s.categories || {}) };
  for (const k of ['accounts', 'transactions', 'planned', 'goals', 'tasks', 'events', 'projects', 'shopping', 'restock', 'balanceChecks']) if (!Array.isArray(out[k])) out[k] = [];
  if (!out.budgets || typeof out.budgets !== 'object') out.budgets = {};

}
function validateImport(obj) {
  const errs = [];
  if (!obj || typeof obj !== 'object') return ['Berkas bukan objek JSON.'];
  const data = obj.app === 'personal-life-dashboard' ? obj.data : obj;
  if (!data || typeof data !== 'object') return ['Struktur data tidak dikenali.'];
  for (const k of ['accounts', 'transactions', 'tasks', 'events']) if (data[k] !== undefined && !Array.isArray(data[k])) errs.push(`Bagian "${k}" harus berupa daftar.`);
  (data.transactions || []).forEach((t, i) => {
    if (i > 2000 && errs.length) return;
    if (!t || !D.valid(t.date) || !(Number(t.amount) > 0) || !['income', 'expense', 'transfer'].includes(t.type)) errs.push(`Transaksi #${i + 1} tidak valid (tanggal/nominal/jenis).`);
  });
  if (!data.categories && !data.accounts && !data.tasks) errs.push('Tidak ada data dasbor di berkas ini.');
  return errs.slice(0, 8);
}

const Store = {
  state: emptyState(),
  storageOk: true,
  lastError: '',
  listeners: new Set(),
  _t: null,
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      this.state = raw ? migrate(JSON.parse(raw)) : emptyState();
      this.storageOk = true;
    } catch (e) {
      this.storageOk = false;
      this.lastError = 'Penyimpanan browser tidak bisa dibaca (mode privat atau diblokir). Data hanya bertahan selama halaman terbuka — ekspor JSON secara berkala.';
      this.state = emptyState();
    }
  },
  persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
      this.storageOk = true; this.lastError = '';
      return true;
    } catch (e) {
      this.storageOk = false;
      this.lastError = /quota/i.test(e && e.name + e.message)
        ? 'Penyimpanan browser penuh. Ekspor backup JSON, lalu hapus data lama atau demo.'
        : 'Gagal menyimpan ke browser. Ekspor JSON agar data tidak hilang.';
      return false;
    }
  },
  /** Semua perubahan lewat sini: mutasi → simpan → beri tahu semua tampilan */
  update(fn, { silent = false } = {}) {
    const r = fn(this.state);
    this.state.meta.updatedAt = Date.now();
    this.persist();
    if (typeof Sync !== 'undefined') Sync.schedule();
    if (!silent) this.emit();
    return r;
  },
  replace(newState) {
    this.state = migrate(newState);
    this.persist();
    this.emit();
  },
  emit() { this.listeners.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },
  on(f) { this.listeners.add(f); return () => this.listeners.delete(f); },
  sizeKB() { try { return Math.round(JSON.stringify(this.state).length / 1024); } catch { return 0; } },
};
const S = () => Store.state;

/* =========================================================
   UI: toast, modal, konfirmasi, form helpers
   ========================================================= */
function toast(msg, { type = '', action, ms = 3200 } = {}) {
  const root = $('#toast-root'); if (!root) return;
  while (root.children.length >= 3) root.firstElementChild.remove(); // jangan menumpuk menutupi tombol
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  root.appendChild(el);
  setTimeout(() => el.remove(), action ? ms + 3000 : ms);
}

const Modal = {
  stack: [],
  open({ title, body, submit = 'Simpan', cancel = 'Batal', wide = false, onSubmit, onOpen, extraFooter = '', danger = false, noFooter = false }) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="btn icon ghost" data-close aria-label="Tutup">${icon('x')}</button></div>
      <div class="modal-b">${body}</div>
      ${noFooter ? '' : `<div class="modal-f"><div class="left">${extraFooter}</div>${cancel ? `<button type="button" class="btn" data-close>${esc(cancel)}</button>` : ''}${submit ? `<button type="submit" class="btn ${danger ? 'danger solid' : 'primary'}">${esc(submit)}</button>` : ''}</div>`}
    </form>`;
    document.body.appendChild(back);
    const form = back.querySelector('form');
    const close = () => { back.remove(); Modal.stack = Modal.stack.filter((x) => x !== back); };
    back.addEventListener('mousedown', (e) => { if (e.target === back) back._downOnBack = true; });
    back.addEventListener('click', (e) => { if (e.target === back && back._downOnBack) close(); back._downOnBack = false; });
    back.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!onSubmit) return close();
      $$('.err', form).forEach((x) => x.remove()); $$('.invalid', form).forEach((x) => x.classList.remove('invalid'));
      try {
        const res = await onSubmit(formData(form), form, close);
        if (res !== false) close();
      } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + err.message, { type: 'bad' }); }
    });
    Modal.stack.push(back);
    bindMoneyInputs(form);
    onOpen && onOpen(form, close);
    const first = form.querySelector('[autofocus]') || form.querySelector('.modal-b input:not([type=hidden]):not([type=checkbox]):not([type=radio]),.modal-b select,.modal-b textarea');
    if (first && window.matchMedia('(min-width: 861px)').matches) setTimeout(() => first.focus(), 30);
    return { form, close };
  },
  closeTop() { const b = Modal.stack.pop(); b && b.remove(); },
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Modal.stack.length) Modal.closeTop(); });

/** Pengganti confirm() — browser/viewer tertentu memblokir dialog bawaan */
function ask(message, { title = 'Konfirmasi', ok = 'Ya, lanjutkan', danger = true } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const m = Modal.open({
      title, body: `<p>${message}</p>`, submit: ok, danger,
      onSubmit: () => { done = true; resolve(true); },
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(m.form)) { obs.disconnect(); if (!done) resolve(false); } });
    obs.observe(document.body, { childList: true });
  });
}

function formData(form) {
  const o = {};
  form.querySelectorAll('input,select,textarea').forEach((el) => {
    if (!el.name) return;
    if (el.type === 'checkbox') {
      if (el.dataset.multi !== undefined) { (o[el.name] = o[el.name] || []); if (el.checked) o[el.name].push(el.value); }
      else o[el.name] = el.checked;
    } else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim();
  });
  return o;
}
function fieldError(form, name, msg) {
  const el = form.querySelector(`[name="${name}"]`);
  if (!el) { toast(msg, { type: 'bad' }); return false; }
  el.classList.add('invalid');
  const wrap = el.closest('.field') || el.parentElement;
  const e = document.createElement('div'); e.className = 'err'; e.textContent = msg;
  wrap.appendChild(e);
  el.focus();
  return false;
}
function bindMoneyInputs(root) {
  root.querySelectorAll('input[data-money]').forEach((el) => {
    const fmt = () => {
      const n = parseAmount(el.value);
      if (!isNaN(n)) el.value = Math.abs(n).toLocaleString('id-ID');
    };
    if (el.value) fmt();
    el.addEventListener('input', () => {
      const pos = el.value.length - el.selectionStart;
      fmt();
      const p = Math.max(0, el.value.length - pos);
      try { el.setSelectionRange(p, p); } catch { }
    });
  });
}

const DAYNAMES = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
function recurrenceFields(rec = {}, kinds = ['none', 'daily', 'weekly', 'days', 'monthly']) {
  const labels = { none: 'Tidak berulang', daily: 'Setiap hari', weekly: 'Setiap minggu (hari yang sama)', days: 'Hari tertentu', monthly: 'Setiap bulan (tanggal yang sama)' };

function bindRecurrence(form) {

function readRecurrence(d) {

/** Apakah item berulang terjadi pada tanggal `day`? (anchor = tanggal mulai) */

  if ((rec.exceptions || []).includes(day)) return false;
  switch (rec.freq) {
    case 'daily': return true;
    case 'weekly': return D.dow(day) === D.dow(anchor);

  const end = rec.until && rec.until < to ? rec.until : to;
  for (; s <= end; s = D.add(s, 1)) if (occursOn(anchor, rec, s)) out.push(s);

  const m = { daily: 'Harian', weekly: 'Mingguan', monthly: 'Bulanan', days: 'Tiap ' + (rec.days || []).map((d) => DAYNAMES[d]).join(', ') };
  return m[rec.freq] || '';
};

function empty(ic, title, text, btn = '') {
  return `<div class="empty">${icon(ic)}<b>${title}</b><span class="small">${text}</span>${btn}</div>`;
}
const demoTag = (o) => (o && o.demo ? ' <span class="pill demo">DEMO</span>' : '');

/* ---------- unduhan berkas (lokal: tautan; di claude.ai: kapabilitas downloads) ---------- */
let _downloadsCap; // undefined = belum dicek
async function saveFile(filename, data, mime = 'application/octet-stream') {
  if (window.claude && typeof window.claude.use === 'function') {
    if (_downloadsCap === undefined) { try { _downloadsCap = await window.claude.use('downloads'); } catch { _downloadsCap = null; } }
    if (_downloadsCap) {
      try {
        const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
        await _downloadsCap.save({ filename, data: blob });
        toast('Berkas disimpan: ' + filename);
        return true;
      } catch (e) {
        if (e && e.code === 'declined') { toast('Penyimpanan dibatalkan.'); return false; }
        if (e && e.code === 'rejected_extension') { toast('Format ' + filename.split('.').pop() + ' tidak didukung di tampilan ini.', { type: 'bad' }); return false; }
        toast('Gagal menyimpan berkas di tampilan ini.', { type: 'bad' }); return false;
      }
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Berkas diunduh: ' + filename);
    return true;
  } catch (e) { toast('Browser menolak unduhan.', { type: 'bad' }); return false; }
}
function readFileAs(file, how = 'text') {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    how === 'buffer' ? r.readAsArrayBuffer(file) : r.readAsText(file);
  });
}
function pickFile(accept) {
  return new Promise((res) => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}

/* =========================================================
   FINANCE ENGINE — semua angka dihitung dari data, tidak ada angka statis
   Aturan saldo:
     saldo akun = saldo awal + Σ transaksi bertanggal ≥ tanggal saldo awal
     pemasukan  → +nominal di akun sumber
     pengeluaran→ −nominal di akun sumber
     transfer   → −nominal di akun asal, +nominal di akun tujuan (bukan pemasukan/pengeluaran)
   Kelompok akun: "spendable" (siap pakai) dan "savings" (tabungan) agar tidak dihitung ganda.
   ========================================================= */
const Actions = {};
const ACC_TYPES = [['cash', 'Uang tunai'], ['bank', 'Rekening bank'], ['ewallet', 'E-wallet'], ['savings', 'Tabungan khusus'], ['emergency', 'Dana darurat'], ['investment', 'Investasi'], ['other', 'Lainnya']];
const accTypeName = (t) => (ACC_TYPES.find((x) => x[0] === t) || [, 'Lainnya'])[1];
const defaultGroup = (t) => (['savings', 'emergency', 'investment'].includes(t) ? 'savings' : 'spendable');
const TX_TYPES = { income: 'Pemasukan', expense: 'Pengeluaran', transfer: 'Transfer' };

const Fin = {
  acc(id) { return byId(S().accounts, id); },
  accName(id) { return Fin.acc(id)?.name || '(akun terhapus)'; },
  activeAccounts() { return S().accounts.filter((a) => !a.archived); },
  accOptions(sel, { empty = false, exclude } = {}) {
    const accs = S().accounts.filter((a) => (!a.archived || a.id === sel) && a.id !== exclude);
    return (empty ? `<option value="">— pilih akun —</option>` : '') +
      ['spendable', 'savings'].map((g) => {
        const list = accs.filter((a) => (a.group || defaultGroup(a.type)) === g);
        if (!list.length) return '';
        return `<optgroup label="${g === 'spendable' ? 'Siap dibelanjakan' : 'Tabungan'}">${list.map((a) => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</optgroup>`;
      }).join('');
  },
  group(accId) { const a = Fin.acc(accId); return a ? (a.group || defaultGroup(a.type)) : 'spendable'; },
  /** efek transaksi terhadap satu akun (memperhitungkan tanggal saldo awal akun) */
  effect(t, accId) {
    const a = Fin.acc(accId); if (!a) return 0;
    if (a.openingDate && t.date < a.openingDate) return 0;
    if (t.type === 'income' && t.accountId === accId) return t.amount;
    if (t.type === 'expense' && t.accountId === accId) return -t.amount;
    if (t.type === 'transfer') { if (t.accountId === accId) return -t.amount; if (t.toAccountId === accId) return t.amount; }
    return 0;
  },
  balance(accId, upTo = D.today()) {
    const a = Fin.acc(accId); if (!a) return 0;
    if (a.openingDate && upTo < a.openingDate) return 0;
    let b = Number(a.openingBalance) || 0;
    for (const t of S().transactions) if (t.date <= upTo) b += Fin.effect(t, accId);
    return b;
  },
  lastUpdated(accId) {
    const a = Fin.acc(accId); let last = a?.openingDate || '';
    for (const t of S().transactions) if ((t.accountId === accId || t.toAccountId === accId) && t.date > last) last = t.date;
    return last;
  },
  groupTotal(group, upTo = D.today()) {
    return sum(S().accounts.filter((a) => (a.group || defaultGroup(a.type)) === group), (a) => Fin.balance(a.id, upTo));
  },
  totals(upTo = D.today()) {
    const spendable = Fin.groupTotal('spendable', upTo), savings = Fin.groupTotal('savings', upTo);
    return { spendable, savings, total: spendable + savings };
  },
  /** transaksi pemasukan/pengeluaran nyata (bukan transfer, bukan penyesuaian saldo) */
  isFlow(t) { return (t.type === 'income' || t.type === 'expense') && !t.adjust; },
  inRange(t, a, b) { return t.date >= a && t.date <= b; },
  flows(from, to) {
    let inc = 0, exp = 0;
    for (const t of S().transactions) if (Fin.isFlow(t) && t.date >= from && t.date <= to) t.type === 'income' ? (inc += t.amount) : (exp += t.amount);
    return { inc, exp, net: inc - exp };
  },
  monthFlows(key) { return Fin.flows(D.monthStart(key), D.monthEnd(key)); },
  spentByCat(from, to) {
    const m = {};
    for (const t of S().transactions) if (t.type === 'expense' && !t.adjust && t.date >= from && t.date <= to) m[t.categoryId] = (m[t.categoryId] || 0) + t.amount;
    return m;
  },
  /* ---------- budget ---------- */
  budgetFor(catId, key) {
    const base = Number(S().budgets[catId]) || 0;
    if (!base) return { base: 0, carry: 0, total: 0 };
    let carry = 0;
    const st = S().settings;
    if (st.rolloverEnabled && st.rollover && st.rollover[catId]) {
      const pk = D.prevMonth(key);
      const spentPrev = Fin.spentByCat(D.monthStart(pk), D.monthEnd(pk))[catId] || 0;
      carry = Math.max(0, base - spentPrev); // hanya sisa positif, satu bulan ke belakang
    }
    return { base, carry, total: base + carry };
  },
  budgetSummary(key) {
    const spent = Fin.spentByCat(D.monthStart(key), D.monthEnd(key));
    const rows = Cat.list('expense').map((c) => {
      const b = Fin.budgetFor(c.id, key);
      const used = spent[c.id] || 0;
      return { cat: c, ...b, used, left: b.total - used, pct: b.total ? used / b.total : 0 };
    }).filter((r) => r.total > 0 || r.used > 0);
    const budgeted = rows.filter((r) => r.total > 0);
    return { rows, totalBudget: sum(budgeted, (r) => r.total), totalUsed: sum(budgeted, (r) => r.used), unbudgetedUsed: sum(rows.filter((r) => !r.total), (r) => r.used) };
  },
  /* ---------- rencana / tagihan ---------- */
  plannedOcc(from, to, { includePaid = false } = {}) {
    const out = [];
    for (const p of S().planned) {
      for (const d of occurrences(p.date, p.rec, from, to)) {
        const st = (p.paid || {})[d];
        if (!includePaid && st) continue;
        out.push({ p, date: d, status: st ? (st === 'skip' ? 'skip' : 'paid') : (d < D.today() ? 'overdue' : 'due'), txId: st && st !== 'skip' ? st : null });
      }
    }
    return out.sort((a, b) => (a.date < b.date ? -1 : 1));
  },
  /** Proyeksi akhir bulan berjalan. Mengembalikan semua komponen agar asumsi bisa ditampilkan. */
  projection(key = D.month(D.today())) {
    const today = D.today();
    const ms = D.monthStart(key), me = D.monthEnd(key);
    const isCurrent = key === D.month(today);
    const asOf = isCurrent ? today : (me < today ? me : D.add(ms, -1));
    const prevEnd = D.add(ms, -1);
    // saldo awal bulan per kelompok (akun yang dibuka di bulan ini dihitung dari saldo awalnya)
    const startOf = (g) => sum(S().accounts.filter((a) => (a.group || defaultGroup(a.type)) === g), (a) => {
      if (!a.openingDate || a.openingDate <= prevEnd) return Fin.balance(a.id, prevEnd);
      if (a.openingDate <= me) return Number(a.openingBalance) || 0;
      return 0;
    });
    const start = { spendable: startOf('spendable'), savings: startOf('savings') };
    const now = { spendable: Fin.groupTotal('spendable', asOf), savings: Fin.groupTotal('savings', asOf) };
    // arus yang sudah terjadi bulan ini
    let inc = 0, exp = 0, adj = 0, tIn = 0, tOut = 0, varExp = 0, expCount = 0;
    for (const t of S().transactions) {
      if (t.date < ms || t.date > asOf) continue;
      const g = Fin.group(t.accountId);
      if (t.type === 'income' && g === 'spendable') { if (t.adjust) adj += t.amount; else inc += t.amount; }
      if (t.type === 'expense' && g === 'spendable') {
        if (t.adjust) adj -= t.amount; else {
          exp += t.amount; if (!(t.source && t.source.kind === 'planned')) { varExp += t.amount; expCount++; }
        }
      }
      if (t.type === 'transfer') {
        const gf = Fin.group(t.accountId), gt = Fin.group(t.toAccountId);
        if (gf === 'spendable' && gt === 'savings') tOut += t.amount;
        if (gf === 'savings' && gt === 'spendable') tIn += t.amount;
      }
    }
    // rencana yang belum terjadi (termasuk yang lewat jatuh tempo bulan ini tapi belum dibayar)
    const pend = Fin.plannedOcc(ms, me).filter((o) => o.status !== 'skip');
    const pe = { inc: 0, exp: 0, toSav: 0, fromSav: 0, savInc: 0, savExp: 0 };
    for (const o of pend) {
      const p = o.p; const g = Fin.group(p.accountId);
      if (p.type === 'income') g === 'savings' ? (pe.savInc += p.amount) : (pe.inc += p.amount);
      else if (p.type === 'expense') g === 'savings' ? (pe.savExp += p.amount) : (pe.exp += p.amount);
      else if (p.type === 'transfer') {
        const gt = Fin.group(p.toAccountId);
        if (g === 'spendable' && gt === 'savings') pe.toSav += p.amount;
        if (g === 'savings' && gt === 'spendable') pe.fromSav += p.amount;
      }
    }
    const planEnd = now.spendable + pe.inc - pe.exp - pe.toSav + pe.fromSav;
    const savEnd = now.savings + pe.savInc - pe.savExp + pe.toSav - pe.fromSav;
    // pola pengeluaran
    const dayNum = isCurrent ? Number(today.slice(8)) : D.daysIn(key);
    const remaining = isCurrent ? D.daysIn(key) - dayNum : 0;
    let basis = 'month', avg = dayNum ? varExp / dayNum : 0, limited = false, basisNote = '';
    if (isCurrent && (dayNum < 7 || expCount < 5)) {
      // coba rata-rata 30 hari terakhir bila riwayatnya cukup
      const from30 = D.add(today, -29);
      const first = S().transactions.filter((t) => t.type === 'expense').map((t) => t.date).sort()[0];
      if (first && first <= D.add(today, -14)) {
        let v = 0; for (const t of S().transactions) if (t.type === 'expense' && !t.adjust && !(t.source && t.source.kind === 'planned') && t.date >= from30 && t.date <= today) v += t.amount;
        const span = Math.min(30, D.diff(first < from30 ? from30 : first, today) + 1);
        avg = v / span; basis = '30d'; basisNote = `rata-rata ${span} hari terakhir`;
      } else { limited = true; basisNote = `baru ${dayNum} hari & ${expCount} transaksi bulan ini`; }
    } else basisNote = `${dayNum} hari pertama bulan ini`;
    if (isCurrent && expCount === 0 && basis === 'month') limited = true;
    const projVar = Math.round(avg * remaining);
    const patternEnd = planEnd - projVar;
    // target tabungan bulanan = jumlah kontribusi rencana pada target aktif
    const goalMonthly = sum(S().goals.filter((g) => !g.done), (g) => g.monthly);
    return {
      key, isCurrent, asOf, start, now, inc, exp, adj, tIn, tOut, pend, pe, planEnd, savEnd,
      dayNum, remaining, avg, projVar, patternEnd, basis, basisNote, limited, expCount, varExp,
      goalMonthly, savGain: savEnd - start.savings,
    };
  },
  /* ---------- target ---------- */
  goalAllocated(g) { return sum(g.allocations || [], (a) => a.amount); },
  goalStatus(g) {
    const alloc = Fin.goalAllocated(g), left = Math.max(0, g.target - alloc);
    const today = D.today();
    let eta = null, monthsNeeded = null, needPerMonth = null, state = 'unknown', note = '';
    if (left <= 0) { state = 'done'; note = 'Target tercapai'; }
    else {
      if (g.monthly > 0) { monthsNeeded = Math.ceil(left / g.monthly); eta = D.addMonths(today, monthsNeeded); }
      if (g.deadline) {
        const monthsLeft = Math.max(0, (Number(g.deadline.slice(0, 4)) - Number(today.slice(0, 4))) * 12 + Number(g.deadline.slice(5, 7)) - Number(today.slice(5, 7)));
        needPerMonth = monthsLeft > 0 ? Math.ceil(left / monthsLeft) : left;
        if (g.deadline < today) { state = 'late'; note = 'Deadline sudah lewat'; }
        else if (!g.monthly) { state = 'unknown'; note = `Perlu ±${rp(needPerMonth)}/bulan`; }
        else if (eta <= g.deadline) { state = 'ontrack'; note = 'Berpotensi tercapai sebelum deadline'; }
        else { state = 'behind'; note = `Kurang cepat — perlu ±${rp(needPerMonth)}/bulan`; }
      } else if (g.monthly) { state = 'ontrack'; note = 'Estimasi tercapai ' + D.fmt(eta, { month: 'long', year: 'numeric' }); }
      else note = 'Isi kontribusi bulanan untuk estimasi';
    }
    return { alloc, left, pct: g.target ? alloc / g.target : 0, eta, monthsNeeded, needPerMonth, state, note };
  },
};

/* =========================================================
   ACTIONS — transaksi
   ========================================================= */
function txFormBody(t, opts = {}) {
  const type = t.type || 'expense';
  const catKind = type === 'income' ? 'income' : 'expense';
  return `
  <div class="typepick" role="radiogroup" aria-label="Jenis transaksi">
    ${['expense', 'income', 'transfer'].map((k) => `<label><input type="radio" name="type" value="${k}" ${k === type ? 'checked' : ''}>${icon(k === 'income' ? 'arrowin' : k === 'expense' ? 'arrowout' : 'swap', 'ico-sm')}${TX_TYPES[k]}</label>`).join('')}
  </div>
  <div class="form">
    ${F.money('amount', 'Nominal', t.amount ?? '', { af: true })}
    ${F.date('date', 'Tanggal', t.date || D.today(), { attrs: `max="${D.today()}"` })}
    <div class="field" data-catwrap ${type === 'transfer' ? 'hidden' : ''}><label for="f_categoryId">Kategori</label><select class="input" id="f_categoryId" name="categoryId">${Cat.options(catKind, t.categoryId, { empty: true })}</select></div>
    ${F.select('accountId', type === 'transfer' ? 'Dari akun' : 'Akun', Fin.accOptions(t.accountId || opts.defaultAcc, { empty: true }))}
    <div class="field" data-towrap ${type === 'transfer' ? '' : 'hidden'}><label for="f_toAccountId">Ke akun</label><select class="input" id="f_toAccountId" name="toAccountId">${Fin.accOptions(t.toAccountId, { empty: true })}</select></div>
    ${F.text('desc', 'Deskripsi', t.desc || '', { full: true, ph: 'mis. Makan siang di kantin' })}
    ${F.area('note', 'Catatan (opsional)', t.note || '', { rows: 2 })}
  </div>
  ${t.source && t.source.kind ? `<div class="banner">${icon('link', 'ico-sm')}<span>Transaksi ini tertaut ke ${t.source.kind === 'planned' ? 'tagihan/rencana' : t.source.kind === 'shopping' ? 'daftar belanja' : 'impor'}. Menghapusnya akan membuka kembali item tersebut.</span></div>` : ''}`;
}
function bindTxForm(form) {
  const upd = () => {
    const type = form.querySelector('[name=type]:checked').value;
    form.querySelector('[data-catwrap]').hidden = type === 'transfer';
    form.querySelector('[data-towrap]').hidden = type !== 'transfer';
    form.querySelector('label[for=f_accountId]').textContent = type === 'transfer' ? 'Dari akun' : 'Akun';
    const sel = form.querySelector('[name=categoryId]');
    const kind = type === 'income' ? 'income' : 'expense';
    if (sel.dataset.kind !== kind) { const cur = sel.value; sel.innerHTML = Cat.options(kind, cur, { empty: true }); sel.dataset.kind = kind; }
  };
  form.querySelector('[name=categoryId]').dataset.kind = form.querySelector('[name=type]:checked').value === 'income' ? 'income' : 'expense';
  $$('[name=type]', form).forEach((r) => r.addEventListener('change', upd));
}
function validateTx(d, form) {
  const amount = parseAmount(d.amount);
  if (!(amount > 0)) return fieldError(form, 'amount', 'Isi nominal lebih dari Rp0.');
  if (amount > 1e13) return fieldError(form, 'amount', 'Nominal terlalu besar.');
  if (!D.valid(d.date)) return fieldError(form, 'date', 'Tanggal tidak valid.');
  if (d.date > D.today()) return fieldError(form, 'date', 'Transaksi aktual tidak boleh bertanggal di masa depan. Gunakan "Tagihan & rencana" untuk yang belum terjadi.');
  if (!d.accountId) return fieldError(form, 'accountId', S().accounts.length ? 'Pilih akun.' : 'Buat akun dulu di tab Akun.');
  if (d.type === 'transfer') {
    if (!d.toAccountId) return fieldError(form, 'toAccountId', 'Pilih akun tujuan.');
    if (d.toAccountId === d.accountId) return fieldError(form, 'toAccountId', 'Akun tujuan harus berbeda.');
  } else if (!d.categoryId) return fieldError(form, 'categoryId', 'Pilih kategori.');
  return { amount };
}
Actions.addTx = (el, ev, preset = {}) => {
  if (!S().accounts.length) {
    return Modal.open({ title: 'Belum ada akun', body: `<p>Transaksi selalu tercatat di sebuah akun (tunai, rekening, e-wallet). Tambahkan akun pertama dulu.</p>`, submit: 'Tambah akun', onSubmit: () => { setTimeout(() => Actions.editAccount(), 0); } });
  }
  const type = (el && el.dataset.type) || preset.type || 'expense';
  const lastAcc = S().settings.lastAccountId;
  let again = false;
  Modal.open({
    title: 'Catat transaksi',
    body: txFormBody({ type, ...preset }, { defaultAcc: Fin.acc(lastAcc) && !Fin.acc(lastAcc).archived ? lastAcc : '' }),
    extraFooter: `<button type="submit" class="btn ghost" data-again>Simpan & tambah lagi</button>`,
    onOpen: (form) => { bindTxForm(form); form.querySelector('[data-again]').onclick = () => (again = true); },
    onSubmit: (d, form) => {
      const v = validateTx(d, form); if (!v) { again = false; return false; }
      const tx = { id: uid('t'), date: d.date, type: d.type, amount: v.amount, categoryId: d.type === 'transfer' ? '' : d.categoryId, accountId: d.accountId, toAccountId: d.type === 'transfer' ? d.toAccountId : '', desc: d.desc, note: d.note, createdAt: Date.now(), ...(preset.source ? { source: preset.source } : {}) };
      Store.update((s) => { s.transactions.push(tx); s.settings.lastAccountId = d.accountId; if (preset.after) preset.after(s, tx); });
      toast(`${TX_TYPES[tx.type]} ${rp(tx.amount)} tersimpan`, { action: { label: 'Urungkan', fn: () => deleteTx(tx.id, true) } });
      if (again) { again = false; setTimeout(() => Actions.addTx(null, null, { type: d.type }), 0); }
    },
  });
};
Actions.editTx = (el) => {
  const t = byId(S().transactions, el.dataset.id); if (!t) return;
  Modal.open({
    title: 'Ubah transaksi', body: txFormBody(t),
    extraFooter: `<button type="button" class="btn danger" data-del>${icon('trash', 'ico-sm')} Hapus</button>`,
    onOpen: (form, close) => { bindTxForm(form); form.querySelector('[data-del]').onclick = async () => { close(); await Actions.deleteTx({ dataset: { id: t.id } }); }; },
    onSubmit: (d, form) => {
      const v = validateTx(d, form); if (!v) return false;
      Store.update((s) => {
        const x = byId(s.transactions, t.id);
        Object.assign(x, { date: d.date, type: d.type, amount: v.amount, categoryId: d.type === 'transfer' ? '' : d.categoryId, accountId: d.accountId, toAccountId: d.type === 'transfer' ? d.toAccountId : '', desc: d.desc, note: d.note });
      });
      toast('Transaksi diperbarui');
    },
  });
};
function deleteTx(id, quiet) {
  let removed;
  Store.update((s) => {
    removed = byId(s.transactions, id); if (!removed) return;
    s.transactions = s.transactions.filter((t) => t.id !== id);
    // lepas tautan agar tagihan/belanja kembali "belum dibayar" — tidak ada hitung ganda
    for (const p of s.planned) for (const k in p.paid || {}) if (p.paid[k] === id) delete p.paid[k];
    for (const it of s.shopping) if (it.txId === id) it.txId = '';
  });
  if (!quiet && removed) toast('Transaksi dihapus', { action: { label: 'Urungkan', fn: () => restoreTx(removed) } });
}
function restoreTx(t) {
  Store.update((s) => {
    s.transactions.push(t);
    if (t.source?.kind === 'planned') { const p = byId(s.planned, t.source.id); if (p) (p.paid = p.paid || {})[t.source.occ] = t.id; }
    if (t.source?.kind === 'shopping') { const it = byId(s.shopping, t.source.id); if (it) it.txId = t.id; }
  });
}
Actions.deleteTx = async (el) => {
  const t = byId(S().transactions, el.dataset.id); if (!t) return;
  if (await ask(`Hapus transaksi <b>${esc(t.desc || TX_TYPES[t.type])}</b> sebesar <b>${rp(t.amount)}</b>? Saldo akun akan dihitung ulang.`, { ok: 'Hapus' })) deleteTx(t.id);
};

/* ---------- akun ---------- */
Actions.editAccount = (el) => {
  const a = el && el.dataset.id ? byId(S().accounts, el.dataset.id) : null;
  const hasTx = a && S().transactions.some((t) => t.accountId === a.id || t.toAccountId === a.id);
  Modal.open({
    title: a ? 'Ubah akun' : 'Tambah sumber dana',
    body: `<div class="form">
      ${F.text('name', 'Nama akun', a?.name || '', { af: true, ph: 'mis. BCA, GoPay, Dompet' })}
      ${F.select('type', 'Jenis akun', F.opts(ACC_TYPES, a?.type || 'bank'))}
      ${F.select('group', 'Dihitung sebagai', F.opts([['spendable', 'Uang siap dibelanjakan'], ['savings', 'Tabungan / tidak untuk belanja']], a?.group || defaultGroup(a?.type || 'bank')), { help: 'Memisahkan aset likuid dan tabungan agar tidak dihitung ganda.' })}
      ${F.money('openingBalance', 'Saldo awal', a ? a.openingBalance : '')}
      ${F.date('openingDate', 'Tanggal saldo awal', a?.openingDate || D.today(), { help: 'Transaksi sebelum tanggal ini dianggap sudah termasuk dalam saldo awal.' })}
      ${F.area('note', 'Catatan (opsional)', a?.note || '', { rows: 2 })}
      <div class="field full"><div class="help">Jangan menyimpan nomor rekening, PIN, atau kata sandi di sini.</div></div>
    </div>`,
    extraFooter: a ? `<button type="button" class="btn danger" data-del>${hasTx ? 'Arsipkan' : 'Hapus'}</button>` : '',
    onOpen: (form, close) => {
      const tsel = form.querySelector('[name=type]'), gsel = form.querySelector('[name=group]');
      tsel.addEventListener('change', () => (gsel.value = defaultGroup(tsel.value)));
      const del = form.querySelector('[data-del]');
      if (del) del.onclick = async () => {
        close();
        if (hasTx) { if (await ask(`Akun <b>${esc(a.name)}</b> punya transaksi, jadi diarsipkan (disembunyikan dari pilihan) — saldo dan riwayat tetap dihitung.`, { ok: 'Arsipkan', danger: false })) { Store.update((s) => (byId(s.accounts, a.id).archived = true)); toast('Akun diarsipkan'); } }
        else if (await ask(`Hapus akun <b>${esc(a.name)}</b>?`, { ok: 'Hapus' })) { Store.update((s) => (s.accounts = s.accounts.filter((x) => x.id !== a.id))); toast('Akun dihapus'); }
      };
    },
    onSubmit: (d, form) => {
      if (!d.name) return fieldError(form, 'name', 'Nama akun wajib diisi.');
      if (S().accounts.some((x) => x.name.toLowerCase() === d.name.toLowerCase() && x.id !== a?.id)) return fieldError(form, 'name', 'Nama akun sudah dipakai.');
      const ob = d.openingBalance === '' ? 0 : parseAmount(d.openingBalance);
      if (isNaN(ob)) return fieldError(form, 'openingBalance', 'Saldo awal harus berupa angka.');
      if (!D.valid(d.openingDate)) return fieldError(form, 'openingDate', 'Tanggal tidak valid.');
      Store.update((s) => {
        if (a) Object.assign(byId(s.accounts, a.id), { name: d.name, type: d.type, group: d.group, openingBalance: ob, openingDate: d.openingDate, note: d.note, archived: false });
        else s.accounts.push({ id: uid('a'), name: d.name, type: d.type, group: d.group, openingBalance: ob, openingDate: d.openingDate, note: d.note, createdAt: Date.now() });
      });
      toast(a ? 'Akun diperbarui' : 'Akun ditambahkan');
    },
  });
};
Actions.reconcile = (el) => {
  const a = byId(S().accounts, el.dataset.id); if (!a) return;
  const cur = Fin.balance(a.id);
  Modal.open({
    title: 'Sesuaikan saldo ' + a.name,
    body: `<p class="small muted">Saldo tercatat: <b class="num">${rp(cur)}</b>. Masukkan saldo sebenarnya (cek aplikasi bank/dompet). Selisihnya dicatat sebagai <i>penyesuaian saldo</i> — tidak dihitung sebagai pemasukan/pengeluaran di laporan.</p>
      <div class="form">${F.money('actual', 'Saldo sebenarnya hari ini', cur, { af: true })}${F.text('desc', 'Keterangan', 'Penyesuaian saldo')}</div>`,
    onSubmit: (d, form) => {
      const v = parseAmount(d.actual); if (isNaN(v)) return fieldError(form, 'actual', 'Isi angka.');
      const diff = v - cur; if (!diff) { toast('Saldo sudah sesuai'); return; }
      Store.update((s) => s.transactions.push({ id: uid('t'), date: D.today(), type: diff > 0 ? 'income' : 'expense', amount: Math.abs(diff), adjust: true, categoryId: diff > 0 ? (Cat.byName('income', 'Pemasukan lainnya')?.id || '') : (Cat.byName('expense', 'Lain-lain')?.id || ''), accountId: a.id, toAccountId: '', desc: d.desc || 'Penyesuaian saldo', createdAt: Date.now() }));
      toast(`Saldo disesuaikan (${rp(diff, { sign: true })})`);
    },
  });
};

/* ---------- cek saldo: aktual (input pengguna) vs seharusnya (hitungan transaksi) ---------- */
Fin.lastCheck = () => (S().balanceChecks || []).slice().sort((a, b) => b.at - a.at)[0] || null;
Fin.checkSummary = (c) => {
  if (!c) return null;
  const rows = Object.entries(c.values).map(([id, v]) => ({ id, name: Fin.accName(id), group: Fin.group(id), ...v, diff: v.actual - v.expected }));
  const part = (g) => { const r = rows.filter((x) => !g || x.group === g); return { expected: sum(r, (x) => x.expected), actual: sum(r, (x) => x.actual), diff: sum(r, (x) => x.diff) }; };
  return { rows, spendable: part('spendable'), savings: part('savings'), total: part() };
};
Actions.checkBalances = () => {
  const accs = Fin.activeAccounts();
  if (!accs.length) return Actions.editAccount();
  Modal.open({
    title: 'Cek saldo aktual', wide: true,
    body: `<p class="small muted">Buka aplikasi bank/e-wallet dan hitung uang tunai, lalu isi saldo sebenarnya. Kolom "Seharusnya" adalah hasil hitungan dari saldo awal + transaksi yang Anda catat. Kosongkan akun yang tidak dicek.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Akun</th><th class="r">Seharusnya</th><th>Aktual</th><th class="r">Selisih</th></tr></thead><tbody>
    ${['spendable', 'savings'].map((g) => accs.filter((a) => Fin.group(a.id) === g).map((a) => `<tr><td>${esc(a.name)}<div class="xs muted">${g === 'savings' ? 'Tabungan' : 'Siap pakai'}</div></td><td class="r num">${rp(Fin.balance(a.id))}</td><td><div class="money"><input class="input" data-money inputmode="numeric" name="act_${a.id}" data-exp="${Fin.balance(a.id)}" placeholder="isi saldo"></div></td><td class="r num" data-diff="${a.id}">—</td></tr>`).join('')).join('')}
    <tr><td><b>Total</b></td><td class="r num"><b>${rp(sum(accs, (a) => Fin.balance(a.id)))}</b></td><td class="num" data-tot-act>—</td><td class="r num" data-tot-diff>—</td></tr>
    </tbody></table></div>`,
    submit: 'Simpan hasil cek',
    onOpen: (form) => {
      const upd = () => {
        let ta = 0, td = 0, any = false;
        $$('input[name^=act_]', form).forEach((i) => {
          const id = i.name.slice(4), cell = form.querySelector(`[data-diff="${id}"]`), v = parseAmount(i.value);
          if (isNaN(v)) { cell.textContent = '—'; cell.className = 'r num'; return; }
          any = true; const d = v - Number(i.dataset.exp); ta += v; td += d;
          cell.textContent = rp(d, { sign: true }); cell.className = 'r num ' + (d > 0 ? 'pos' : d < 0 ? 'neg' : '');
        });
        form.querySelector('[data-tot-act]').textContent = any ? rp(ta) : '—';
        const t = form.querySelector('[data-tot-diff]'); t.textContent = any ? rp(td, { sign: true }) : '—'; t.className = 'r num ' + (td > 0 ? 'pos' : td < 0 ? 'neg' : '');
      };
      form.addEventListener('input', upd);
    },
    onSubmit: (d, form) => {
      const values = {};
      for (const a of accs) { const v = parseAmount(d['act_' + a.id]); if (!isNaN(v)) values[a.id] = { actual: v, expected: Fin.balance(a.id) }; }
      if (!Object.keys(values).length) return fieldError(form, 'act_' + accs[0].id, 'Isi minimal satu saldo aktual.');
      Store.update((s) => { s.balanceChecks.push({ id: uid('bc'), date: D.today(), at: Date.now(), values }); s.balanceChecks = s.balanceChecks.slice(-60); });
      const sm = Fin.checkSummary(Fin.lastCheck());
      toast(sm.total.diff ? `Selisih total ${rp(sm.total.diff, { sign: true })}` : 'Saldo cocok dengan catatan 👍');
    },
  });
};
Actions.applyCheck = async () => {
  const c = Fin.lastCheck(); const sm = Fin.checkSummary(c); if (!sm) return;
  const rows = sm.rows.filter((r) => r.diff);
  if (!rows.length) return toast('Tidak ada selisih.');
  if (!(await ask(`Catat ${rows.length} penyesuaian saldo agar catatan sama dengan saldo aktual? Penyesuaian tidak dihitung sebagai pemasukan/pengeluaran di laporan. Lebih baik dulu cari transaksi yang lupa dicatat.`, { ok: 'Sesuaikan', danger: false }))) return;
  Store.update((s) => {
    for (const r of rows) {
      const diff = r.actual - Fin.balance(r.id); if (!diff) continue;
      s.transactions.push({ id: uid('t'), date: D.today(), type: diff > 0 ? 'income' : 'expense', amount: Math.abs(diff), adjust: true, categoryId: diff > 0 ? (Cat.byName('income', 'Pemasukan lainnya')?.id || '') : (Cat.byName('expense', 'Lain-lain')?.id || ''), accountId: r.id, toAccountId: '', desc: 'Penyesuaian dari cek saldo', createdAt: Date.now() });
    }
  });
  toast('Saldo disesuaikan');
};
function checkCard(compact) {
  const c = Fin.lastCheck(); const sm = Fin.checkSummary(c);
  const head = `<div class="card-h"><h3>Uang aktual vs seharusnya</h3><button class="btn sm ${compact ? '' : 'primary'}" data-act="checkBalances">Cek saldo sekarang</button></div>`;
  if (!sm) return `<div class="card">${head}<p class="small muted">Belum pernah dicek. Isi saldo aktual tiap akun untuk melihat selisih dengan catatan (mis. ada pengeluaran yang lupa dicatat).</p></div>`;
  const line = (l, p) => `<div class="ln"><span>${l}</span><span class="num">${rp(p.expected)} → <b>${rp(p.actual)}</b> <b class="${p.diff > 0 ? 'pos' : p.diff < 0 ? 'neg' : ''}">(${rp(p.diff, { sign: true })})</b></span></div>`;
  const stale = D.diff(c.date, D.today());
  return `<div class="card">${head}<p class="xs muted" style="margin-bottom:6px">Dicek ${D.fmt(c.date)}${stale > 7 ? ` · ${stale} hari lalu, sebaiknya cek ulang` : ''} · seharusnya → aktual (selisih)</p>
    <div class="ledger">${sm.spendable.expected || sm.spendable.actual ? line('Uang siap pakai', sm.spendable) : ''}${sm.savings.expected || sm.savings.actual ? line('Tabungan', sm.savings) : ''}${line('<b>Total</b>', sm.total)}</div>
    ${compact ? '' : `<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Akun</th><th class="r">Seharusnya</th><th class="r">Aktual</th><th class="r">Selisih</th></tr></thead><tbody>${sm.rows.map((r) => `<tr><td>${esc(r.name)}</td><td class="r num">${rp(r.expected)}</td><td class="r num">${rp(r.actual)}</td><td class="r num ${r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : ''}">${rp(r.diff, { sign: true })}</td></tr>`).join('')}</tbody></table></div>
    ${sm.total.diff ? `<p class="xs muted" style="margin-top:8px">Selisih negatif biasanya berarti ada pengeluaran yang belum dicatat. <button class="btn sm ghost" data-act="addTx">Catat yang terlewat</button><button class="btn sm ghost" data-act="applyCheck">Sesuaikan ke aktual</button></p>` : ''}`}</div>`;
}

/* ---------- tabungan bebas (cara sheet Excel pengguna) ----------
   total uang − dana dicadangkan − tagihan belum dibayar bulan ini − (sisa hari × jatah per hari) */
Fin.freeSavings = () => {
  const sp = S().settings.savePlan || { reserved: [], dailyA: 0, dailyMax: 0 };
  const today = D.today(), key = D.month(today);
  const total = Fin.totals().total;
  const reserved = sum(sp.reserved || [], (r) => r.amount);
  const bills = sum(Fin.plannedOcc(today < D.monthStart(key) ? today : D.monthStart(key), D.monthEnd(key)).filter((o) => o.p.type === 'expense' && o.status !== 'skip'), (o) => o.p.amount);
  const days = D.daysIn(key) - Number(today.slice(8)) + 1; // termasuk hari ini
  const after = total - reserved - bills;
  return { sp, total, reserved, bills, days, after, planA: after - days * (sp.dailyA || 0), planMax: after - days * (sp.dailyMax || 0) };
};
Actions.editSavePlan = () => {
  const sp = S().settings.savePlan || { reserved: [{ name: 'Tabungan semester / UKT', amount: 4500000 }], dailyA: 40000, dailyMax: 60000 };

    body: `<p class="small muted">Rumus: <b>total uang − dana dicadangkan − tagihan bulan ini yang belum dibayar − (sisa hari × jatah per hari)</b> = tabungan yang benar-benar bebas.</p>
    <div class="label">Dana yang dicadangkan (tidak boleh disentuh)</div>
    ${rows.map((r, i) => `<div class="form"><div class="field"><input class="input" name="rn_${i}" value="${esc(r.name || '')}" placeholder="mis. Tabungan semester 7" aria-label="Nama dana"></div><div class="field"><div class="money"><input class="input" data-money inputmode="numeric" name="ra_${i}" value="${r.amount || ''}" placeholder="0" aria-label="Nominal"></div></div></div>`).join('')}
    <div class="form">${F.money('dailyA', 'Jatah per hari · Plan A (hemat)', sp.dailyA || '')}${F.money('dailyMax', 'Jatah per hari · Plan Maks', sp.dailyMax || '')}</div>`,
    onSubmit: (d) => {
      const reserved = rows.map((_, i) => ({ name: d['rn_' + i] || 'Dana dicadangkan', amount: parseAmount(d['ra_' + i]) || 0 })).filter((r) => r.amount > 0);

};
function freeSavingsCard() {

  if (!S().settings.savePlan) return `<div class="card"><div class="card-h"><h3>Tabungan bebas bulan ini</h3><button class="btn sm primary" data-act="editSavePlan">Atur</button></div><p class="small muted">Hitung tabungan seperti di Excel: total uang dikurangi dana cadangan (mis. Rp4.500.000), tagihan bulan ini, dan sisa hari × jatah harian.</p></div>`;
  const f = Fin.freeSavings();
  const neg = (v) => (v < 0 ? 'neg' : 'pos');
  return `<div class="card"><div class="card-h"><h3>Tabungan bebas bulan ini</h3><button class="btn sm" data-act="editSavePlan">Ubah</button></div>
  <div class="ledger">
    <div class="ln"><span>Total uang (semua akun, tercatat)</span><b class="num">${rp(f.total)}</b></div>
    ${(f.sp.reserved || []).map((r) => `<div class="ln"><span><span class="op">−</span>${esc(r.name)}</span><b class="num">${rp(r.amount)}</b></div>`).join('')}
    ${f.bills ? `<div class="ln"><span><span class="op">−</span>Tagihan bulan ini belum dibayar</span><b class="num">${rp(f.bills)}</b></div>` : ''}
    <div class="ln" style="font-weight:650"><span>= Uang setelah dikurangi</span><b class="num">${rp(f.after)}</b></div>
    ${f.sp.dailyA ? `<div class="ln"><span><span class="op">−</span>Plan A: ${f.days} hari × ${rp(f.sp.dailyA)}</span><b class="num">${rp(f.days * f.sp.dailyA)}</b></div><div class="ln total"><span>Tabungan · Plan A</span><b class="num ${neg(f.planA)}">${rp(f.planA)}</b></div>` : ''}
    ${f.sp.dailyMax ? `<div class="ln"><span><span class="op">−</span>Plan Maks: ${f.days} hari × ${rp(f.sp.dailyMax)}</span><b class="num">${rp(f.days * f.sp.dailyMax)}</b></div><div class="ln total"><span>Tabungan · Plan Maks</span><b class="num ${neg(f.planMax)}">${rp(f.planMax)}</b></div>` : ''}
  </div><p class="xs muted" style="margin-top:8px">Sisa hari dihitung termasuk hari ini (${D.fmt(D.today())} s.d. ${D.fmt(D.monthEnd(D.month(D.today())))}). Pakai "Cek saldo" agar total uang sesuai kenyataan.</p></div>`;
}

    title: 'Atur budget bulanan', wide: true,
    body: `<p class="small muted">Isi budget per kategori. Kosongkan untuk kategori tanpa budget. Nilai berlaku setiap bulan.</p>
    ${F.check('rolloverEnabled', 'Aktifkan rollover: sisa budget bulan lalu ditambahkan ke bulan ini (hanya kategori yang dicentang di bawah)', st.rolloverEnabled)}
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kategori</th><th>Budget / bulan</th><th>Rollover</th></tr></thead><tbody>
